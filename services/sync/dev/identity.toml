# Local-only identity stand-in (dev/identity.mjs). Run with `pnpm dev:identity`.
name = "worlds-identity-dev"
main = "identity.mjs"
compatibility_date = "2026-08-15"

[vars]
# Access level for anyone without an explicit grant (POST /dev/grant).
DEFAULT_LEVEL = "edit"

[[durable_objects.bindings]]
name = "GRANTS"
class_name = "Grants"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Grants"]
