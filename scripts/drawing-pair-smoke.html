<!doctype html><html lang="en"><meta charset="utf-8"><title>Clean and annotated export</title><button id="run">Run pair export checks</button><div id="images" style="display:flex;gap:20px"></div><pre id="result">Not run</pre><script type="module">
import{newScene,newNode}from'/src/drawing/model.ts';import{exportAnnotatedArchive}from'/src/drawing/frameArchive.ts';import{crc32}from'/src/drawing/archive.ts';
document.querySelector('#run').onclick=async()=>{const cases=[],check=(name,passed)=>cases.push({name,passed});try{const scene=newScene(),frame=scene.frames[scene.defaultFrameId];Object.assign(frame,{w:32,h:24,background:'#ffffff'});const note=newNode('shape',scene.layerOrder[0],frame.id,{x:4,y:4,w:16,h:12});note.paint.fill='#ff0000';note.paint.strokeWidth=0;note.annotationGroup='annotation';scene.nodes[note.id]=note;scene.nodeOrder=[note.id];const before=JSON.stringify(scene),result=await exportAnnotatedArchive(scene,frame.id,1,new AbortController().signal),bytes=new Uint8Array(await result.blob.arrayBuffer()),view=new DataView(bytes.buffer),names=[];let offset=0;while(view.getUint32(offset,true)===0x04034b50){const length=view.getUint32(offset+18,true),nameLength=view.getUint16(offset+26,true),extra=view.getUint16(offset+28,true),name=new TextDecoder().decode(bytes.slice(offset+30,offset+30+nameLength)),at=offset+30+nameLength+extra,data=bytes.slice(at,at+length);names.push(name);check(name+' CRC matches actual PNG bytes',crc32(data)===view.getUint32(offset+14,true));const blob=new Blob([data],{type:'image/png'}),bitmap=await createImageBitmap(blob),canvas=new OffscreenCanvas(bitmap.width,bitmap.height),ctx=canvas.getContext('2d');ctx.drawImage(bitmap,0,0);check(name+' exact annotation pixels',JSON.stringify([...ctx.getImageData(8,8,1,1).data])===JSON.stringify(name==='clean.png'?[255,255,255,255]:[255,0,0,255]));const figure=document.createElement('figure'),image=new Image();image.src=URL.createObjectURL(blob);figure.append(image,document.createTextNode(name));document.querySelector('#images').append(figure);bitmap.close();offset=at+length;}check('archive contains exactly clean.png and annotated.png',JSON.stringify(names)==='["clean.png","annotated.png"]');const cancelled=new AbortController();cancelled.abort();let aborted=false;try{await exportAnnotatedArchive(scene,frame.id,1,cancelled.signal);}catch(e){aborted=e.name==='AbortError';}check('cancel produces no ZIP',aborted);let missing=false;try{await exportAnnotatedArchive(scene,'missing',1,new AbortController().signal);}catch{missing=true;}check('missing frame refused',missing);check('clean and annotated rendering preserves editable source',before===JSON.stringify(scene));}catch(e){cases.push({name:'unexpected error',passed:false,error:String(e),stack:e.stack});}document.querySelector('#result').textContent=JSON.stringify({passed:cases.every(c=>c.passed),cases},null,2);};
</script></html>
