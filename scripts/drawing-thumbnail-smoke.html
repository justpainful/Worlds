<!doctype html><html lang="en"><meta charset="utf-8"><title>Layer thumbnail verification</title><h1>Layer thumbnail verification</h1><button id="run">Run thumbnail checks</button><div id="fixture" style="width:420px"></div><pre id="result">Not run</pre>
<script type="module">
import'/src/dev/mockTauri.ts';import React from'react';import{createRoot}from'react-dom/client';import{LayerBrowser}from'/src/drawing/LayerBrowser.tsx';import{newScene,newLayer,newNode,DEFAULT_BRUSH}from'/src/drawing/model.ts';
document.querySelector('#run').onclick=async()=>{const s=newScene(),frame=s.frames[s.defaultFrameId];Object.assign(frame,{w:1100,h:740});const shapeLayer=s.layers[s.layerOrder[0]],ink=newLayer('Strokes'),notes=newLayer('Text');for(const l of[ink,notes]){s.layers[l.id]=l;s.layerOrder.push(l.id);}const add=n=>{s.nodes[n.id]=n;s.nodeOrder.push(n.id);return n;};const shape=add(newNode('shape',shapeLayer.id,frame.id,{x:70,y:220,w:250,h:220}));shape.shape='ellipse';shape.paint.fill='#e6a555';const title=add(newNode('text',notes.id,frame.id,{x:62,y:42,w:970,h:90}));title.text='مساحة لكل فكرة';Object.assign(title.textStyle,{size:48,weight:600,color:'#243b36',direction:'rtl',align:'end'});for(const[i,kind]of['ink','oil','crayon','watercolor','highlighter'].entries()){const n=add(newNode('stroke',ink.id,frame.id,{x:85,y:500+i*31,w:430,h:40}));n.brush={...DEFAULT_BRUSH,kind,color:['#315d49','#ce6f53','#e4ad45','#7b8fbc','#f1d15b'][i],size:i===4?24:12,opacity:i===4?.45:1};n.samples=Array.from({length:48},(_,j)=>({x:j*8,y:16+Math.sin(j/7)*10,pressure:.65,tiltX:0,tiltY:0,time:j*5}));n.seed=12+i;}
const root=createRoot(document.querySelector('#fixture'));root.render(React.createElement(LayerBrowser,{scene:s,currentId:shapeLayer.id,frameId:frame.id,solo:null,arabic:false,editable:false,onSelect:()=>{},onSolo:()=>{},onChange:()=>{}}));const started=performance.now();while(performance.now()-started<15000){await new Promise(requestAnimationFrame);const canvases=[...document.querySelectorAll('#fixture canvas')];if(canvases.length===3&&canvases.every(c=>c.dataset.coveredPixels!==undefined)){const cases=canvases.map(c=>({name:c.getAttribute('aria-label'),width:c.width,height:c.height,coveredPixels:Number(c.dataset.coveredPixels),passed:Number(c.dataset.coveredPixels)>0}));document.querySelector('#result').textContent=JSON.stringify({passed:cases.every(c=>c.passed),cases,scope:'Production LayerBrowser component and serialized thumbnail queue, full-frame1100x740 Arabic text and five stroke types.'},null,2);return;}}document.querySelector('#result').textContent=JSON.stringify({passed:false,error:'Thumbnail jobs did not finish within15 seconds'});};
</script></html>
