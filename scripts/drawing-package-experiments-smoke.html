<!doctype html><html lang="en"><meta charset="utf-8"><title>Editable package verification</title><h1>Editable project and experiment package</h1><button id="run">Run package checks</button><div id="images" style="display:flex;gap:20px"></div><pre id="result">Not run</pre><script type="module">
import '/src/dev/mockTauri.ts';import{api}from'/src/lib/api.ts';import{edit}from'/src/drawing/operations.ts';import{createDrawingPackage,readDrawingPackage,importDrawingBundlePackage}from'/src/drawing/package.ts';import{DrawingRenderer}from'/src/drawing/renderer.ts';
document.querySelector('#run').onclick=async()=>{const cases=[],renderer=new DrawingRenderer();const check=(name,passed)=>cases.push({name,passed});try{const profile=await api.profile(),source=await api.createPage({title:'Package source',kind:'drawing'});let doc=await api.drawingLoad(source.id);const frame=doc.scene.defaultFrameId;const paint=async(page,color)=>{const d=await api.drawingLoad(page);return api.drawingApply(page,edit(profile.id,d.revision,'Change frame color',[{type:'patch',collection:'frames',id:frame,fields:{background:color,w:80,h:60}}]));};await paint(source.id,'#ff0000');const branch=await api.drawingExperimentCreate(source.id,'Blue alternative','Retain red comparison');await paint(branch.id,'#0000ff');await paint(source.id,'#00ff00');doc=await api.drawingLoad(source.id);const blob=await createDrawingPackage(doc.scene,undefined,source.id,undefined,{includeHistory:true,includePreview:true,includeExperiments:true}),portable=await readDrawingPackage(blob);check('version3 contains preview, history and editable experiment',portable.version===3&&!!portable.preview&&!!portable.history&&portable.experiments?.length===1);const bundle=await importDrawingBundlePackage(blob,'Independent imported bundle',undefined,{history:true,experiments:true});const original=await api.drawingLoad(bundle.page.id),alternative=await api.drawingLoad(bundle.experiments[0].id),base=await api.drawingVersionScene(bundle.page.id,alternative.experiment.baseVersionId);check('experiment points to newly owned source',alternative.experiment.sourceId===bundle.page.id&&bundle.page.id!==source.id);check('operation IDs change and source authors remain',original.operations[0].id!==doc.operations[0].id&&original.operations[0].actor===doc.operations[0].actor);
for(const[label,scene,color]of[['Imported main',original.scene,[0,255,0,255]],['Original comparison',base,[255,0,0,255]],['Editable alternative',alternative.scene,[0,0,255,255]]]){const png=await renderer.exportFrame(scene,scene.frames[frame],1,true),bitmap=await createImageBitmap(png),canvas=new OffscreenCanvas(bitmap.width,bitmap.height),ctx=canvas.getContext('2d');ctx.drawImage(bitmap,0,0);const actual=[...ctx.getImageData(40,30,1,1).data];check(label+' exact pixels',JSON.stringify(actual)===JSON.stringify(color));const figure=document.createElement('figure'),image=new Image();image.src=URL.createObjectURL(png);figure.append(image,document.createTextNode(label));document.querySelector('#images').append(figure);bitmap.close();}
await paint(bundle.experiments[0].id,'#ffff00');check('imported experiment accepts real editable operations',(await api.drawingLoad(bundle.experiments[0].id)).revision===1);check('editing imported branch leaves main and comparison unchanged',JSON.stringify((await api.drawingLoad(bundle.page.id)).scene)===JSON.stringify(original.scene)&&JSON.stringify(await api.drawingVersionScene(bundle.page.id,alternative.experiment.baseVersionId))===JSON.stringify(base));const undo=await api.drawingHistoryToggle(bundle.experiments[0].id,1,crypto.randomUUID(),false,profile.id);check('Undo restores imported branch blue',undo.document.scene.frames[frame].background==='#0000ff');const cancelled=new AbortController();cancelled.abort();let aborted=false;try{await importDrawingBundlePackage(blob,'Cancelled',cancelled.signal,{experiments:true});}catch(e){aborted=e.name==='AbortError';}check('cancel rejects before staging',aborted);
}catch(e){cases.push({name:'unexpected error',passed:false,error:String(e),stack:e.stack});}finally{renderer.dispose();}document.querySelector('#result').textContent=JSON.stringify({passed:cases.every(c=>c.passed),cases,limitations:['Synthetic browser backend. Native atomic install and source authorization have separate tests.']},null,2);};
</script></html>
