<!doctype html><html lang="en"><meta charset="utf-8"><title>Static SVG verification</title><h1>Static SVG verification</h1><button id="run">Run SVG checks</button><a id="download" hidden download="drawing-svg-checks.json">Download results</a><a id="svg" hidden download="drawing-safe.svg">Download SVG</a><pre id="result">Not run</pre>
<script type="module">
import '/src/dev/mockTauri.ts';import{sanitizeSvg,rasterizeSvg,flattenedSvg}from'/src/drawing/svg.ts';import{decodeDrawingImage}from'/src/drawing/imageIngest.ts';
const bytes=text=>new TextEncoder().encode(text),prefix='<svg xmlns="http://www.w3.org/2000/svg" width="8" height="4">',suffix='</svg>',safe=prefix+'<title>SVG_PRIVATE_SOURCE_MARKER</title><rect width="4" height="4" fill="#ff0000"/>'+suffix;
document.querySelector('#run').onclick=async()=>{const cases=[],resources=[],check=(name,passed,detail)=>cases.push({name,passed,detail});
try{
 const attacks=[['script',prefix+'<script>alert(1)<\/script>'+suffix],['event',prefix+'<rect onload="alert(1)"/>'+suffix],['network image',prefix+'<image href="https://example.test/private.png"/>'+suffix],['embedded SVG',prefix+'<image href="data:image/svg+xml;base64,PHN2Zy8+"/>'+suffix],['foreign object',prefix+'<foreignObject><div/></foreignObject>'+suffix],['CSS',prefix+'<style>@import "https://example.test/a.css"</style>'+suffix],['style attribute',prefix+'<rect style="fill:url(https://example.test/a)"/>'+suffix],['external paint',prefix+'<rect fill="url(https://example.test/a)"/>'+suffix],['use expansion',prefix+'<use href="#loop"/>'+suffix],['entity','<!DOCTYPE svg [<!ENTITY x SYSTEM "file:///private">]>'+prefix+'&x;'+suffix],['cyclic local mask',prefix+'<defs><mask id="cycle"><rect width="8" height="4" mask="url(#cycle)"/></mask></defs>'+suffix],['namespace',prefix+'<html xmlns="http://www.w3.org/1999/xhtml"/>'+suffix],['oversized','<svg xmlns="http://www.w3.org/2000/svg" width="10000" height="10000"/>']];
 for(const[name,xml]of attacks){let refused=false;try{sanitizeSvg(bytes(xml));}catch{refused=true;}check('refuses '+name,refused);}
 const clean=sanitizeSvg(bytes('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 8 4"><defs><linearGradient id="g"><stop offset="0" stop-color="#ff0000"/><stop offset="1" stop-color="#0000ff"/></linearGradient></defs><path d="M0 0H8V4H0Z" fill="url(#g)"/></svg>'));check('local vector gradient and viewBox dimensions accepted',clean.width===8&&clean.height===4);
 const png=await rasterizeSvg(bytes(safe)),bitmap=await createImageBitmap(png);resources.push(()=>bitmap.close());const canvas=new OffscreenCanvas(8,4),ctx=canvas.getContext('2d');ctx.drawImage(bitmap,0,0);const expected=ctx.getImageData(0,0,8,4).data;let pixels=true;for(let y=0;y<4;y++)for(let x=0;x<8;x++){const i=(y*8+x)*4,e=x<4?[255,0,0,255]:[0,0,0,0];if(e.some((v,k)=>v!==expected[i+k]))pixels=false;}check('static SVG becomes exact transparent PNG pixels',pixels);
 const incoming=await decodeDrawingImage(new File([safe],'safe.svg',{type:'image/svg+xml'}));resources.push(incoming.dispose);check('production image ingest owns PNG instead of incoming XML',incoming.original.type==='image/png'&&incoming.header.mime==='image/png'&&incoming.name==='safe.png'&&incoming.source.naturalWidth===8&&incoming.source.naturalHeight===4);check('raster original excludes XML metadata',!new TextDecoder().decode(await incoming.original.arrayBuffer()).includes('SVG_PRIVATE_SOURCE_MARKER'));
 const svg=await flattenedSvg(png),url=URL.createObjectURL(svg);const link=document.querySelector('#svg');link.href=url;link.hidden=false;const roundtrip=await rasterizeSvg(new Uint8Array(await svg.arrayBuffer())),again=await createImageBitmap(roundtrip);resources.push(()=>again.close());ctx.clearRect(0,0,8,4);ctx.drawImage(again,0,0);const actual=ctx.getImageData(0,0,8,4).data;check('exported flattened SVG reimports with identical RGBA bytes',actual.every((v,i)=>v===expected[i]));
 const cancelled=new AbortController(),pending=rasterizeSvg(bytes(safe),cancelled.signal);cancelled.abort();let aborted=false;try{await pending;}catch(e){aborted=e.name==='AbortError';}check('cancel during actual SVG image decode refuses result',aborted);
}catch(e){check('unexpected error',false,String(e));}finally{resources.forEach(dispose=>dispose());}
const out=document.querySelector('#result'),link=document.querySelector('#download');out.textContent=JSON.stringify({passed:cases.every(c=>c.passed),cases,limitations:['Static flattened SVG support, not editable imported vector paths. Synthetic browser fixture; native save UI separately verified.']},null,2);link.href=URL.createObjectURL(new Blob([out.textContent],{type:'application/json'}));link.hidden=false;};
</script></html>
