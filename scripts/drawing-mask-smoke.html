async function image(width,height,fn){const c=document.createElement('canvas');c.width=width;c.height=height;const data=new Uint8ClampedArray(width*height*4);for(let y=0;y<height;y++)for(let x=0;x<width;x++)data.set(fn(x,y),(y*width+x)*4);c.getContext('2d').putImageData(new ImageData(data,width,height),0,0);const img=new Image();img.src=c.toDataURL();await img.decode();return img;}
document.querySelector('#run').onclick=async()=>{const cases=[],images=new Map(),r=new DrawingRenderer({previewImages:images}),canvas=document.createElement('canvas');canvas.width=40;canvas.height=24;const s=newScene(),n=newNode('image',s.layerOrder[0],s.defaultFrameId,{x:10,y:6,w:16,h:8});s.frames[s.defaultFrameId].w=40;s.frames[s.defaultFrameId].h=24;s.nodes[n.id]=n;s.nodeOrder=[n.id];n.assetId='source';s.assets.source={id:'source',attachmentId:'source-original',name:'Immutable red and blue',mime:'image/png',width:16,height:8};images.set('source-original',await image(16,8,x=>x<8?[255,0,0,128]:[0,0,255,255]));const originalSource=images.get('source-original').src;let serial=0;

const pixels=async(name,color,scene=s)=>{const actual=await draw(scene),expected=new Uint8ClampedArray(actual.length);for(let y=0;y<24;y++)for(let x=0;x<40;x++)if(x>=n.x&&x<n.x+n.w&&y>=n.y&&y<n.y+n.h)expected.set(color(x-n.x,y-n.y),(y*40+x)*4);const result=expectedCompare(actual,expected);check(name,result.differentPixels===0,result);};
const maskAsset=async(fn)=>{const attachmentId=`alpha-${serial++}`;images.set(attachmentId,await image(16,8,(x,y)=>[255,255,255,fn(x,y)]));s.assets.alpha={id:'alpha',attachmentId,name:'Owned alpha',mime:'image/png',width:16,height:8};};
try{
 const gradient=await runMaskRasterTask({kind:'gradient',mask:{width:4,height:1,alpha:new Uint8ClampedArray(4)},from:{x:0,y:0},to:{x:4,y:0},start:0,end:255});check('actual mask worker computes independent grayscale gradient',JSON.stringify([...gradient.alpha])==='[32,96,159,223]',{alpha:[...gradient.alpha]});const blob=await encodeMaskRaster({...gradient,alpha:gradient.alpha.slice()}),decoded=await createImageBitmap(blob),c=document.createElement('canvas');c.width=4;c.height=1;c.getContext('2d').drawImage(decoded,0,0);const alpha=Array.from(c.getContext('2d').getImageData(0,0,4,1).data).filter((_,i)=>i%4===3);check('actual worker PNG has exact independent alpha',JSON.stringify(alpha)==='[32,96,159,223]',{alpha});decoded.close();

 await maskAsset(x=>x<8?0:255);s.masks.m={id:'m',name:'Alpha',assetId:'alpha',enabled:true,inverted:false,linked:true,x:0,y:0,w:16,h:8,base:0,strokes:[]};n.effects=[{id:'invert',kind:'invert',amount:1,enabled:true,maskId:'m'}];await pixels('linked effect mask keeps red pigment and inverts only blue pixels',x=>x<8?[255,0,0,128]:[255,255,0,255]);s.masks.m.enabled=false;await pixels('disabled effect mask applies the whole adjustment',x=>x<8?[0,255,255,128]:[255,255,0,255]);s.masks.m.enabled=true;s.masks.m.inverted=true;await pixels('inverted effect mask swaps the affected half',x=>x<8?[0,255,255,128]:[0,0,255,255]);s.masks.m.inverted=false;await maskAsset(()=>128);await pixels('grayscale effect coverage blends in premultiplied RGBA',x=>x<8?[127,128,128,128]:[128,128,127,255]);
 Object.assign(s.masks.m,{assetId:undefined,linked:false,x:10,y:6,w:8,h:8,base:1});await pixels('unlinked effect mask uses world coordinates',x=>x<8?[0,255,255,128]:[0,0,255,255]);n.x=14;await pixels('moving image invalidates world-mask effect cache',x=>x<4?[0,255,255,128]:x<8?[255,0,0,128]:[0,0,255,255]);n.x=10;
 await maskAsset(x=>x<8?128:255);Object.assign(s.masks.m,{assetId:'alpha',linked:true,x:0,y:0,w:16,h:8,base:0});n.maskId='m';const before=await draw(),old=JSON.stringify(s),cropped=imageCropChanges(s,n,{x:4,y:2,w:8,h:4},'trim'),preview=cropPreviewScene(s,cropped.node,cropped.changes),after=await draw(preview),expected=new Uint8ClampedArray(before.length);for(let y=8;y<12;y++)for(let x=14;x<22;x++){const at=(y*40+x)*4;expected.set(before.subarray(at,at+4),at);}const cropComparison=expectedCompare(after,expected);check('trim crop preserves linked node/effect mask placement and original pixels',cropComparison.differentPixels===0&&JSON.stringify(s)===old,{...cropComparison,sourceUnchanged:JSON.stringify(s)===old});
 const rasterCheck=async name=>{const before=await draw(),source=JSON.stringify(s),result=await rasterizeImage(s,n.id,new AbortController().signal,images),url=URL.createObjectURL(result.blob),baked=new Image();try{baked.src=url;await baked.decode();images.set('baked-output',baked);const asset={id:'baked',attachmentId:'baked-output',name:'Baked result',mime:'image/png',width:result.width,height:result.height},changes=rasterizedImageChanges(s,n.id,result.sourceKey,asset),scene=applyChanges(s,changes),actual=await draw(scene),comparison=expectedCompare(actual,before);check(name,comparison.differentPixels===0&&JSON.stringify(s)===source,{...comparison,sourceUnchanged:JSON.stringify(s)===source,originalStillOwned:scene.assets.source.attachmentId===s.assets.source.attachmentId});}finally{URL.revokeObjectURL(url);}};await rasterCheck('reversible rasterization preserves linked masks, effects and original ownership');Object.assign(s.masks.m,{linked:false,x:10,y:6});await rasterCheck('reversible rasterization bakes unlinked world masks at their current pose');Object.assign(s.masks.m,{linked:true,x:0,y:0});const stop=new AbortController(),pendingRaster=rasterizeImage(s,n.id,stop.signal,images);stop.abort();let rasterCancelled=false;try{await pendingRaster;}catch(e){rasterCancelled=e.name==='AbortError';}check('rasterization cancellation returns no PNG',rasterCancelled);
 delete n.maskId;images.set('constant-source',await image(16,8,()=>[100,150,200,255]));s.assets.source.attachmentId='constant-source';const adjustments=[['brightness',.2,[120,180,240,255]],['contrast',.2,[94,154,214,255]],['saturation',-.5,[121,146,171,255]],['temperature',.5,[132,150,168,255]],['grayscale',1,[143,143,143,255]],['invert',1,[155,105,55,255]],['blur',1,[100,150,200,255]],['sharpen',1,[100,150,200,255]],['pixelate',3,[100,150,200,255]]];for(const[kind,amount,expected]of adjustments){n.effects=[{id:kind,kind,amount,enabled:true}];await pixels(`actual ${kind} worker matches independent constant-color output`,kind==='blur'?(x,y)=>[100,150,200,Math.round(255*(x===0||x===15?2:3)*(y===0||y===7?2:3)/9)]:()=>expected);}
 images.set('mixed-alpha-source',await image(16,8,(x,y)=>[[255,0,0,255],[0,0,255,0],[0,255,0,128],[255,255,0,255]][(y%2)*2+x%2]));s.assets.source.attachmentId='mixed-alpha-source';n.effects=[{id:'pixelate-mixed',kind:'pixelate',amount:2,enabled:true}];await pixels('pixelate2x2 mixes red, hidden blue, half-alpha green and yellow in premultiplied space',()=>[204,153,0,160]);images.set('impulse-source',await image(16,8,(x,y)=>x===8&&y===4?[100,100,100,255]:[50,80,120,255]));s.assets.source.attachmentId='impulse-source';n.effects=[{id:'sharpen-impulse',kind:'sharpen',amount:1,enabled:true}];await pixels('sharpen cross-neighbor impulse matches independently calculated clamp values',(x,y)=>x===8&&y===4?[255,180,20,255]:Math.abs(x-8)+Math.abs(y-4)===1?[0,60,140,255]:[50,80,120,255]);s.assets.source.attachmentId='constant-source';
 n.effects=[{id:'brightness',kind:'brightness',amount:-.5,enabled:true},{id:'invert',kind:'invert',amount:1,enabled:true}];await pixels('effect order brightness then invert',()=>[205,180,155,255]);n.effects.reverse();await pixels('effect order invert then brightness',()=>[78,52,28,255]);n.effects=[];await pixels('reset adjustments restores exact original pigment',()=>[100,150,200,255]);check('all rendering leaves encoded original unchanged',images.get('source-original').src===originalSource);
}catch(e){check('unexpected error',false,{error:String(e)});}finally{r.dispose();}
const result={passed:cases.every(c=>c.passed),cases,scope:'Production mask/PNG/effect workers and renderer. Independent source-pixel goldens and crop spatial oracle. Synthetic owned-preview images; native/UI acceptance separate.',tolerance:'Premultiplied RGBA8 maximum2, exact mask PNG alpha.'};output.textContent=JSON.stringify(result,null,2);download.href=URL.createObjectURL(new Blob([output.textContent],{type:'application/json'}));download.hidden=false;};
