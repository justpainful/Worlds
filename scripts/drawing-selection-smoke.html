<!doctype html><html lang="en"><meta charset="utf-8"><title>Drawing selection verification</title>
<style>body{font:15px system-ui;margin:24px}pre{white-space:pre-wrap}canvas{max-width:45%;border:1px solid #aaa}</style>
<h1>Drawing selection verification</h1><p>Actual disposable worker, PNG alpha, preview and persisted-mask comparisons. Synthetic data only.</p><button id="run">Run selection checks</button><a id="download" hidden download="drawing-selection-checks.json">Download results</a><pre id="result">Not run</pre>
<script type="module">
import "/src/dev/mockTauri.ts";
import {runSelectionTask} from "/src/drawing/selectionTasks.ts";
import {DrawingRenderer} from "/src/drawing/renderer.ts";
import {DEFAULT_BRUSH,newNode} from "/src/drawing/model.ts";
import {newDrawing} from "/src/drawing/operations.ts";
import {strokeDabs} from "/src/drawing/brush.ts";
import {maskNewPaint} from "/src/drawing/selectionPaint.ts";
import {objectTransformOrigin,transformObjects} from "/src/drawing/objectTransforms.ts";
import {api} from "/src/lib/api.ts";
import {useStore} from "/src/state/store.ts";
const output=document.querySelector("#result"),button=document.querySelector("#run"),download=document.querySelector("#download"),surface=(w=256,h=256)=>{const c=document.createElement("canvas");c.width=w;c.height=h;return c;},read=c=>c.getContext("2d").getImageData(0,0,c.width,c.height).data;
function compare(a,b){let differentPixels=0,maxError=0;for(let i=0;i<a.length;i+=4){let error=Math.abs(a[i+3]-b[i+3]);for(let c=0;c<3;c++)error=Math.max(error,Math.abs(Math.round(a[i+c]*a[i+3]/255)-Math.round(b[i+c]*b[i+3]/255)));if(error>2)differentPixels++;maxError=Math.max(maxError,error);}return{differentPixels,maxError};}
async function pngAlpha(record){const image=await createImageBitmap(record.blob),box=record.result.imageBounds,c=surface(image.width,image.height);c.getContext("2d").drawImage(image,0,0);const bytes=read(c);let differences=0;for(let y=0;y<box.h;y++)for(let x=0;x<box.w;x++)if(bytes[(y*box.w+x)*4+3]!==record.result.mask[(box.y+y)*record.result.width+box.x+x])differences++;image.close();c.width=c.height=1;return differences;}
button.onclick=async()=>{
 button.disabled=true;download.hidden=true;const results=[];output.textContent="Running";const emit=()=>output.textContent=JSON.stringify({results},null,2);
 try{
  if(!new URLSearchParams(location.search).has("mock"))throw Error("Explicit mock backend required");await useStore.getState().init();
  const signal=new AbortController().signal,request={width:64,height:48,mode:"replace",operation:{kind:"shape",shape:"rect",points:[{x:4,y:4},{x:60,y:44}]}},first=await runSelectionTask(request,signal),before=first.result.mask.slice();
  const hole=await runSelectionTask({...request,mode:"subtract",previous:first.result.mask,operation:{kind:"shape",shape:"rect",points:[{x:20,y:16},{x:44,y:32}]}},signal),holeAlpha=await pngAlpha(hole);
  results.push({name:"actual worker keeps full selection and exact cropped PNG holes",pixels:hole.result.pixels,bounds:hole.result.bounds,pngAlphaDifferences:holeAlpha,previousRetained:first.result.mask.length===3072&&first.result.mask.every((v,i)=>v===before[i]),passed:hole.result.pixels===1856&&holeAlpha===0&&first.result.mask.every((v,i)=>v===before[i])});emit();
  const feather=await runSelectionTask({...request,previous:hole.result.mask,operation:{kind:"edges",grow:0,feather:2}},signal),softAlpha=await pngAlpha(feather);results.push({name:"worker feather retains fractional PNG alpha",pngAlphaDifferences:softAlpha,passed:softAlpha===0&&feather.result.mask.some(v=>v>0&&v<255)});emit();
  const controller=new AbortController(),running=runSelectionTask({width:4096,height:4096,mode:"replace",operation:{kind:"all"}},controller.signal);setTimeout(()=>controller.abort(),10);let cancelled=false;try{await running;}catch(error){cancelled=error.name==="AbortError";}results.push({name:"actual worker terminates on cancel",passed:cancelled});emit();
  const a=await runSelectionTask({width:256,height:256,mode:"replace",operation:{kind:"shape",shape:"rect",points:[{x:68,y:52},{x:124,y:92}]}},signal),worldHole=await runSelectionTask({width:256,height:256,mode:"subtract",previous:a.result.mask,operation:{kind:"shape",shape:"rect",points:[{x:84,y:64},{x:108,y:80}]}},signal),selected=await runSelectionTask({width:256,height:256,mode:"replace",previous:worldHole.result.mask,operation:{kind:"edges",grow:0,feather:2}},signal),maskImage=await createImageBitmap(selected.blob),box=selected.result.imageBounds;
  const s=newDrawing().scene,n=newNode("stroke",s.layerOrder[0],s.defaultFrameId,{x:30,y:20,w:180,h:120}),r=new DrawingRenderer({tileBackend:new URLSearchParams(location.search).has("canvas")?"canvas":"auto"}),v={x:0,y:0,w:256,h:256,scale:1};n.samples=[{x:30,y:30,pressure:1,tiltX:0,tiltY:0,time:0},{x:140,y:70,pressure:1,tiltX:0,tiltY:0,time:20}];n.brush={...DEFAULT_BRUSH,size:52,pressureSize:false,color:"#cf3366",opacity:0.65};n.opacity=0.7;n.seed=42;
  const raw=surface(),rc=raw.getContext("2d");rc.translate(n.x,n.y);r.paintDabs(rc,strokeDabs(n.samples,n.brush,n.seed),n.brush,s,{x:0,y:0,w:n.w,h:n.h});const bytes=read(raw),expected=surface(),ec=expected.getContext("2d"),data=ec.createImageData(256,256);
  for(let i=0;i<bytes.length;i+=4){data.data[i]=bytes[i];data.data[i+1]=bytes[i+1];data.data[i+2]=bytes[i+2];data.data[i+3]=Math.round(bytes[i+3]*n.opacity*n.brush.opacity*selected.result.mask[i/4]/255);}ec.putImageData(data,0,0);
  const actual=surface(),clips=new Map([[n.id,{rect:box,source:maskImage}]]);r.render(actual,s,v,{background:false,draft:n,draftClips:clips});const preview=compare(read(actual),read(expected));results.push({name:"transient full-resolution selection clips pigment before opacity",comparison:preview,passed:preview.differentPixels===0&&Object.keys(s.nodes).length===0});emit();
  const attachment=await api.importBytes(null,"synthetic-selection.png",new Uint8Array(await selected.blob.arrayBuffer())),asset={id:"selection-asset",attachmentId:attachment.id,name:"Selection",mime:"image/png",width:box.w,height:box.h},selection={...selected.result,frame:s.frames[s.defaultFrameId]},masked=maskNewPaint(n,selection,asset);s.nodes[n.id]=masked.node;s.nodeOrder=[n.id];s.assets[asset.id]=asset;s.masks[masked.change.id]=masked.change.value;await r.prepare(s);r.render(actual,s,v,{background:false});const persisted=compare(read(actual),read(expected));results.push({name:"owned linked selection mask equals transient preview",comparison:persisted,passed:persisted.differentPixels===0});emit();
  const canonical=read(actual).slice(),blank=surface(1,1);r.render(actual,s,v,{background:false,draft:n,drafts:[n],draftClips:new Map([[n.id,{rect:box,source:blank}]])});let duplicateDifferences=0;const duplicate=read(actual);for(let i=0;i<duplicate.length;i++)if(duplicate[i]!==canonical[i])duplicateDifferences++;results.push({name:"committed paint suppresses duplicate draft and temporary clip",differences:duplicateDifferences,passed:duplicateDifferences===0});emit();
  const origin=objectTransformOrigin(s,[masked.node]),next=transformObjects(s,[masked.node],{centerX:128,centerY:128,scale:0.7,rotation:27,flipX:true,flipY:false})[0];s.nodes[n.id]=next;r.render(actual,s,v,{background:false});
  const local=surface(180,120),lc=local.getContext("2d");r.paintDabs(lc,strokeDabs(n.samples,n.brush,n.seed),n.brush,s,{x:0,y:0,w:180,h:120});const angle=next.rotation*Math.PI/180,cs=Math.cos(angle),sn=Math.sin(angle),fx=next.flipX?-1:1,fy=next.flipY?-1:1,sx=next.w/180,sy=next.h/120,m=new DOMMatrix([cs*fx*sx,sn*fx*sx,-sn*fy*sy,cs*fy*sy,next.x+next.w/2-cs*fx*next.w/2+sn*fy*next.h/2,next.y+next.h/2-sn*fx*next.w/2-cs*fy*next.h/2]);
  const pigment=surface(),alpha=surface(),pc=pigment.getContext("2d"),ac=alpha.getContext("2d");pc.setTransform(m);pc.globalAlpha=n.opacity*n.brush.opacity;pc.drawImage(local,0,0);ac.setTransform(m);ac.drawImage(maskImage,box.x-n.x,box.y-n.y);const pp=pc.getImageData(0,0,256,256),aa=read(alpha);for(let i=3;i<pp.data.length;i+=4)pp.data[i]=Math.round(pp.data[i]*aa[i]/255);pc.resetTransform();pc.clearRect(0,0,256,256);pc.putImageData(pp,0,0);const moved=compare(read(actual),read(pigment));results.push({name:"selection mask follows original axes through scale rotation and reflection",comparison:moved,passed:moved.differentPixels===0&&JSON.stringify(next.samples)===JSON.stringify(n.samples)});emit();
  r.dispose();maskImage.close();for(const c of[raw,expected,actual,blank,local,pigment,alpha])c.width=c.height=1;
  const record={completed:true,passed:results.every(r=>r.passed),criteria:"Exact worker PNG alpha/previous bytes; unchanged premultiplied RGBA8 tolerance2 for independent renderer comparisons.",results,fullEditorAcceptance:false};output.textContent=JSON.stringify(record,null,2);download.href=URL.createObjectURL(new Blob([JSON.stringify(record,null,2)],{type:"application/json"}));download.hidden=false;
 }catch(error){output.textContent=JSON.stringify({passed:false,results,error:String(error)},null,2);}finally{button.disabled=false;}
};
</script></html>
