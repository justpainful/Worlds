<!doctype html><html lang="en"><meta charset="utf-8"><title>Floating pixel verification</title>
<style>body{font:15px system-ui;margin:24px}pre{white-space:pre-wrap}button{font:inherit;padding:8px}</style>
<h1>Floating pixel verification</h1><p>Synthetic source, actual extraction Worker, independent alpha arithmetic and owned preview images.</p><button id="run">Run floating checks</button><a id="download" hidden download="drawing-floating-checks.json">Download results</a><pre id="result">Not run</pre>
<script type="module">
import "/src/dev/mockTauri.ts";
import {DrawingRenderer} from "/src/drawing/renderer.ts";
import {newDrawing} from "/src/drawing/operations.ts";
import {newNode,newLayer} from "/src/drawing/model.ts";
import {captureSelectedPixels} from "/src/drawing/pixelCapture.ts";
import {useStore} from "/src/state/store.ts";
import {api} from "/src/lib/api.ts";
import {runSelectionTask} from "/src/drawing/selectionTasks.ts";
import {extractPixelPng} from "/src/drawing/floatingTasks.ts";
import {floatingPixelArtwork,pixelSourcePlan,projectedPixelScene,selectionCropAlpha} from "/src/drawing/floatingPixels.ts";
import {transformObjects} from "/src/drawing/objectTransforms.ts";
const button=document.querySelector("#run"),output=document.querySelector("#result"),download=document.querySelector("#download"),W=160,H=80;
const canvas=()=>{const c=document.createElement("canvas");c.width=W;c.height=H;return c;},read=c=>c.getContext("2d").getImageData(0,0,W,H).data;
function compare(a,b){let differentPixels=0,maxError=0;for(let i=0;i<a.length;i+=4){let e=Math.abs(a[i+3]-b[i+3]);for(let k=0;k<3;k++)e=Math.max(e,Math.abs(Math.round(a[i+k]*a[i+3]/255)-Math.round(b[i+k]*b[i+3]/255)));maxError=Math.max(maxError,e);if(e>2)differentPixels++;}return{differentPixels,maxError};}
async function image(blob){const url=URL.createObjectURL(blob),img=new Image();img.src=url;try{await img.decode();return{img,dispose:()=>URL.revokeObjectURL(url)};}catch(e){URL.revokeObjectURL(url);throw e;}}
button.onclick=async()=>{
 button.disabled=true;download.hidden=true;const results=[],resources=[],surfaces=[],renderers=[];output.textContent="Running";
 try{
  if(!new URLSearchParams(location.search).has("mock"))throw Error("Explicit synthetic backend required");
  await useStore.getState().init();const capturePage=await api.createPage({title:"Floating pixels fixture",kind:"drawing"});
  const signal=new AbortController().signal,request={width:W,height:H,mode:"replace",operation:{kind:"shape",shape:"rect",points:[{x:8,y:8},{x:48,y:40}]}},first=await runSelectionTask(request,signal),hole=await runSelectionTask({...request,mode:"subtract",previous:first.result.mask,operation:{kind:"shape",shape:"rect",points:[{x:20,y:16},{x:32,y:28}]}},signal),chosen=await runSelectionTask({...request,previous:hole.result.mask,operation:{kind:"edges",grow:0,feather:2}},signal);
  const s=newDrawing().scene,f=s.frames[s.defaultFrameId];f.w=W;f.h=H;f.background="transparent";
  const original=newNode("shape",s.layerOrder[0],f.id,{x:0,y:0,w:64,h:48});original.shape="rect";original.paint={...original.paint,fill:"#cc2211",stroke:"transparent",strokeWidth:0};original.maskId="original-mask";s.nodes[original.id]=original;s.nodeOrder=[original.id];s.masks[original.maskId]={id:original.maskId,name:"Original alpha",enabled:true,inverted:false,linked:true,x:0,y:0,w:64,h:48,base:0.5,strokes:[]};
  const retained=JSON.stringify({nodes:s.nodes,masks:s.masks}),selection={...chosen.result,frame:f},box=selection.imageBounds,alpha=selectionCropAlpha(selection),source=new Uint8ClampedArray(box.w*box.h*4);
  for(let y=0;y<box.h;y++)for(let x=0;x<box.w;x++){const at=(y*box.w+x)*4;if(x+box.x<64&&y+box.y<48){source[at]=204;source[at+1]=34;source[at+2]=17;source[at+3]=128;}}
  const expectedSource=source.slice(),png=await extractPixelPng({width:box.w,height:box.h,data:source},alpha,signal),content=await image(png),erase=await image(chosen.blob);resources.push(content,erase);
  const decoded=document.createElement("canvas");decoded.width=box.w;decoded.height=box.h;decoded.getContext("2d").drawImage(content.img,0,0);const decodedBytes=decoded.getContext("2d").getImageData(0,0,box.w,box.h).data,expectedPng=expectedSource.slice(),croppedAlpha=selectionCropAlpha(selection);for(let i=0;i<croppedAlpha.length;i++)expectedPng[i*4+3]=Math.round(128*croppedAlpha[i]/255);
  const extraction=compare(decodedBytes,expectedPng);results.push({name:"actual extraction Worker PNG matches independent alpha multiplication",comparison:extraction,passed:extraction.differentPixels===0&&selection.mask.length===W*H});decoded.width=decoded.height=1;
  const plan=pixelSourcePlan(s,selection,s.layerOrder[0],"current",true),actual=canvas(),reference=canvas(),raw=new Uint8ClampedArray(W*H*4);surfaces.push(actual,reference);

  const deleted=raw.slice();for(let i=0;i<W*H;i++)deleted[i*4+3]=Math.round(deleted[i*4+3]*(1-selection.mask[i]/255));
  const r=new DrawingRenderer({tileBackend:new URLSearchParams(location.search).has("canvas")?"canvas":"auto"});renderers.push(r);
  const art=floatingPixelArtwork(s,plan,"move"),images=new Map([[art.asset.attachmentId,content.img],[art.eraseAsset.attachmentId,erase.img]]);r.setPreviewImages(images);
  const erased=projectedPixelScene(s,art,null);r.render(actual,erased,{x:0,y:0,w:W,h:H,scale:1},{background:false});const deletion=compare(read(actual),deleted);results.push({name:"raster erase preserves existing source mask and matches independent remaining alpha",comparison:deletion,passed:deletion.differentPixels===0&&JSON.stringify({nodes:s.nodes,masks:s.masks})===retained});
  const moved={...art.node,x:art.node.x+80},view={x:0,y:0,w:W,h:H,scale:1};r.render(actual,projectedPixelScene(s,art,moved),view,{background:false});const ctx=reference.getContext("2d");ctx.putImageData(new ImageData(deleted,W,H),0,0);ctx.drawImage(content.img,box.x+80,box.y);const movement=compare(read(actual),read(reference));results.push({name:"floating move composites extracted pigment over independently erased source",comparison:movement,passed:movement.differentPixels===0});
  const scaled=transformObjects(projectedPixelScene(s,art,art.node),[art.node],{centerX:105,centerY:42,scale:0.75,rotation:27,flipX:true,flipY:false})[0];r.render(actual,projectedPixelScene(s,art,scaled),view,{background:false});ctx.resetTransform();ctx.clearRect(0,0,W,H);ctx.putImageData(new ImageData(deleted,W,H),0,0);const a=scaled.rotation*Math.PI/180,c=Math.cos(a),sn=Math.sin(a),fx=scaled.flipX?-1:1,fy=scaled.flipY?-1:1,sx=scaled.w/box.w,sy=scaled.h/box.h;ctx.setTransform(c*fx*sx,sn*fx*sx,-sn*fy*sy,c*fy*sy,scaled.x+scaled.w/2-c*fx*scaled.w/2+sn*fy*scaled.h/2,scaled.y+scaled.h/2-sn*fx*scaled.w/2-c*fy*scaled.h/2);ctx.drawImage(content.img,0,0);const transformed=compare(read(actual),read(reference));results.push({name:"floating rotation scale and reflection match independent image matrix",comparison:transformed,passed:transformed.differentPixels===0&&JSON.stringify({nodes:s.nodes,masks:s.masks})===retained});
  const sampleScene=structuredClone(s),layerId=sampleScene.layerOrder[0],baseLayer=newLayer("Backdrop"),baseNode=newNode("shape",baseLayer.id,f.id,{x:0,y:0,w:W,h:H});baseNode.shape="rect";baseNode.paint={...baseNode.paint,fill:"#44aa66",stroke:"transparent",strokeWidth:0};sampleScene.layers[baseLayer.id]=baseLayer;sampleScene.layerOrder=[baseLayer.id,...sampleScene.layerOrder];sampleScene.nodes[baseNode.id]=baseNode;sampleScene.nodeOrder=[baseNode.id,...sampleScene.nodeOrder];sampleScene.layers[layerId].opacity=0.4;sampleScene.layers[layerId].blend="multiply";
  const currentCapture=await captureSelectedPixels(capturePage.id,sampleScene,selection,layerId,"current",signal),currentImage=await image(currentCapture.blob);resources.push(currentImage);const cropCanvas=document.createElement("canvas");cropCanvas.width=box.w;cropCanvas.height=box.h;const cropContext=cropCanvas.getContext("2d");cropContext.drawImage(currentImage.img,0,0);const currentComparison=compare(cropContext.getImageData(0,0,box.w,box.h).data,expectedPng);results.push({name:"current-layer capture samples raw pigment before layer opacity and blending",comparison:currentComparison,passed:currentComparison.differentPixels===0});
  const layerSurface=canvas(),mergedReference=canvas();surfaces.push(layerSurface,mergedReference);layerSurface.getContext("2d").putImageData(new ImageData(raw,W,H),0,0);const mergedContext=mergedReference.getContext("2d");mergedContext.fillStyle="#44aa66";mergedContext.fillRect(0,0,W,H);mergedContext.globalAlpha=0.4;mergedContext.globalCompositeOperation="multiply";mergedContext.drawImage(layerSurface,0,0);const mergedBytes=mergedContext.getImageData(box.x,box.y,box.w,box.h).data;for(let i=0;i<croppedAlpha.length;i++)mergedBytes[i*4+3]=Math.round(mergedBytes[i*4+3]*croppedAlpha[i]/255);
  const visibleCapture=await captureSelectedPixels(capturePage.id,sampleScene,selection,layerId,"visible",signal),visibleImage=await image(visibleCapture.blob);resources.push(visibleImage);cropContext.clearRect(0,0,box.w,box.h);cropContext.drawImage(visibleImage.img,0,0);const visibleComparison=compare(cropContext.getImageData(0,0,box.w,box.h).data,mergedBytes);results.push({name:"visible-layer capture includes actual opacity and multiply composition without frame background",comparison:visibleComparison,passed:visibleComparison.differentPixels===0});cropCanvas.width=cropCanvas.height=1;
  const missing=new DrawingRenderer(),pending=projectedPixelScene(s,art,null);renderers.push(missing);missing.render(actual,pending,view,{background:false});const unloaded=compare(read(actual),raw);results.push({name:"an unloaded erase asset never paints a rectangular eraser placeholder",comparison:unloaded,passed:unloaded.differentPixels===0});
  const record={completed:true,passed:results.every(r=>r.passed),results,criteria:"Independent RGBA alpha equations and image matrix; unchanged premultiplied RGBA8 tolerance2. Actual disposable extraction Worker and PNG decode.",fullEditorAcceptance:false};output.textContent=JSON.stringify(record,null,2);download.href=URL.createObjectURL(new Blob([JSON.stringify(record,null,2)],{type:"application/json"}));download.hidden=false;
 }catch(error){output.textContent=JSON.stringify({passed:false,results,error:String(error)},null,2);}finally{for(const r of renderers)r.dispose();for(const r of resources)r.dispose();for(const c of surfaces)c.width=c.height=1;button.disabled=false;}
};
</script></html>
