<!doctype html><html lang="en"><meta charset="utf-8"><title>Mixed layer blend verification</title><h1>Mixed layer blend verification</h1><button id="run">Run blend checks</button><a id="download" hidden download="drawing-blend-checks.json">Download results</a><pre id="result">Not run</pre>
<script type="module">
import'/src/dev/mockTauri.ts';import{newScene,newLayer,newNode}from'/src/drawing/model.ts';import{DrawingRenderer}from'/src/drawing/renderer.ts';
document.querySelector('#run').onclick=async()=>{const cases=[],s=newScene(),bottom=s.layers[s.layerOrder[0]],top=newLayer('Mixed top layer');s.layers[top.id]=top;s.layerOrder.push(top.id);Object.assign(s.frames[s.defaultFrameId],{w:48,h:32,background:'transparent'});const imageCanvas=document.createElement('canvas');imageCanvas.width=8;imageCanvas.height=8;const bytes=new Uint8ClampedArray(8*8*4);for(let y=0;y<8;y++)for(let x=0;x<8;x++)bytes.set(x<4?[180,50,90,255]:[20,180,220,128],(y*8+x)*4);imageCanvas.getContext('2d').putImageData(new ImageData(bytes,8,8),0,0);const image=new Image();image.src=imageCanvas.toDataURL();await image.decode();s.assets.image={id:'image',attachmentId:'owned-image',name:'Mixed alpha image',mime:'image/png',width:8,height:8};const raster=newNode('image',bottom.id,s.defaultFrameId,{x:0,y:0,w:40,h:30});raster.assetId='image';s.nodes[raster.id]=raster;s.nodeOrder.push(raster.id);const shape=newNode('shape',top.id,s.defaultFrameId,{x:6,y:3,w:34,h:24});shape.shape='rect';shape.paint.fill='#72bd4480';shape.paint.stroke='#f09020';shape.paint.strokeWidth=2;s.nodes[shape.id]=shape;s.nodeOrder.push(shape.id);const text=newNode('text',top.id,s.defaultFrameId,{x:9,y:6,w:30,h:22});text.text='A';text.textStyle={...text.textStyle,font:'Arial',size:18,weight:400,color:'#f5f5f7',leading:1,direction:'ltr'};s.nodes[text.id]=text;s.nodeOrder.push(text.id);const renderer=new DrawingRenderer({previewImages:new Map([['owned-image',image]])}),canvas=document.createElement('canvas');canvas.width=48;canvas.height=32;
const read=async scene=>{await renderer.prepare(scene);renderer.render(canvas,scene,{x:0,y:0,w:48,h:32,scale:1},{background:false});return canvas.getContext('2d').getImageData(0,0,48,32).data;};
try{const backdrop=await read({...s,layerOrder:[bottom.id]}),source=await read({...s,layerOrder:[top.id]});top.opacity=.6;const blend=(b,c,mode)=>mode==='multiply'?b*c:mode==='screen'?b+c-b*c:mode==='overlay'?(b<=.5?2*b*c:1-2*(1-b)*(1-c)):mode==='darken'?Math.min(b,c):mode==='lighten'?Math.max(b,c):c;
for(const mode of['source-over','multiply','screen','overlay','darken','lighten']){top.blend=mode;const actual=await read(s);let different=0,maxError=0;for(let i=0;i<actual.length;i+=4){const ab=backdrop[i+3]/255,as=source[i+3]/255*.6,alpha=as+ab*(1-as);let error=Math.abs(actual[i+3]-Math.round(alpha*255));for(let k=0;k<3;k++){const b=backdrop[i+k]/255,c=source[i+k]/255,pigment=(1-as)*ab*b+(1-ab)*as*c+ab*as*blend(b,c,mode);error=Math.max(error,Math.abs(Math.round(actual[i+k]*actual[i+3]/255)-Math.round(pigment*255)));}maxError=Math.max(maxError,error);if(error>2)different++;}cases.push({name:`${mode}: mixed image, shape, text and layer opacity match independent alpha/blend equations`,passed:different===0,differentPixels:different,maxError});}
}catch(e){cases.push({name:'unexpected error',passed:false,error:String(e)});}finally{renderer.dispose();}const out=document.querySelector('#result'),link=document.querySelector('#download');out.textContent=JSON.stringify({passed:cases.every(c=>c.passed),cases,scope:'Production renderer mixed layers. Each isolated source pigment is measured separately, then the final blend is independently calculated in premultiplied sRGB8. No native/UI acceptance.',tolerance:'Maximum2 in premultiplied RGBA8.'},null,2);link.href=URL.createObjectURL(new Blob([out.textContent],{type:'application/json'}));link.hidden=false;};
</script></html>
