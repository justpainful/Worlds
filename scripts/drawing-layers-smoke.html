<!doctype html><html lang="en"><meta charset="utf-8"><title>Layer group verification</title><h1>Layer group verification</h1><button id="run">Run group checks</button><a id="download" hidden download="drawing-layer-checks.json">Download results</a><pre id="result">Not run</pre>
<script type="module">
import '/src/dev/mockTauri.ts';import {newScene,newLayer,newNode} from '/src/drawing/model.ts';import {DrawingRenderer} from '/src/drawing/renderer.ts';
document.querySelector('#run').onclick=async()=>{const cases=[],s=newScene(),p=s.layers[s.layerOrder[0]],c=newLayer('Child'),r=new DrawingRenderer(),canvas=document.createElement('canvas');canvas.width=canvas.height=16;s.frames[s.defaultFrameId].w=s.frames[s.defaultFrameId].h=16;p.opacity=.5;c.parentId=p.id;s.layers[c.id]=c;s.layerOrder.push(c.id);for(const[l,color]of [[p,'#ff0000'],[c,'#0000ff']]){const n=newNode('shape',l.id,s.defaultFrameId,{x:0,y:0,w:16,h:16});n.shape='rect';n.paint.fill=color;n.paint.strokeWidth=0;s.nodes[n.id]=n;s.nodeOrder.push(n.id);}
const draw=(name,expected)=>{r.render(canvas,s,{x:0,y:0,w:16,h:16,scale:1},{background:false});const data=canvas.getContext('2d').getImageData(0,0,16,16).data;let different=0;for(let i=0;i<data.length;i+=4){if(Math.abs(data[i+3]-expected[3])>2)different++;for(let k=0;k<3;k++)if(Math.abs(Math.round(data[i+k]*data[i+3]/255)-Math.round(expected[k]*expected[3]/255))>2)different++;}cases.push({name,expected,actual:Array.from(data.slice(0,4)),differentBytes:different,passed:different===0});};
try{await r.prepare(s);draw('overlapping children receive parent opacity exactly once',[0,0,255,128]);p.visible=false;draw('hidden parent hides every child',[0,0,0,0]);p.visible=true;c.opacity=.5;draw('child then parent opacity composite as isolated groups',[127,0,128,128]);p.opacity=1;c.opacity=1;draw('restored parent settings preserve full child pixels',[0,0,255,255]);const exported=await r.exportFrame(s,s.frames[s.defaultFrameId],1,true),bmp=await createImageBitmap(exported),ctx=canvas.getContext('2d');ctx.clearRect(0,0,16,16);ctx.drawImage(bmp,0,0);cases.push({name:'export uses same grouped scene',passed:JSON.stringify(Array.from(ctx.getImageData(0,0,1,1).data))==='[0,0,255,255]'});bmp.close();}catch(e){cases.push({name:'unexpected error',error:String(e),passed:false});}finally{r.dispose();}
const out=document.querySelector('#result'),link=document.querySelector('#download');out.textContent=JSON.stringify({passed:cases.every(c=>c.passed),cases,limitations:['Synthetic renderer fixture; current UI and native journal acceptance separate.']},null,2);link.href=URL.createObjectURL(new Blob([out.textContent],{type:'application/json'}));link.hidden=false;};
</script></html>
