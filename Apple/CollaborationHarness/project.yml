name: WorldsCollaborationHarness
options:
  deploymentTarget:
    macOS: "14.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    GENERATE_INFOPLIST_FILE: YES
    CODE_SIGNING_ALLOWED: NO
packages:
  WorldsCore:
    path: ../WorldsCore
targets:
  CollaborationHarness-macOS:
    type: application
    platform: macOS
    sources:
      - App
      - path: Fixtures
        buildPhase: resources
    dependencies:
      - package: WorldsCore
        product: WorldsCollaboration
      - package: WorldsCore
        product: WorldsCollaborationEditor
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.worlds.test.collaboration.macos
        INFOPLIST_KEY_NSAppTransportSecurity_NSAllowsLocalNetworking: YES
  CollaborationHarness-macOS-UITests:
    type: bundle.ui-testing
    platform: macOS
    sources: [UITests]
    dependencies:
      - target: CollaborationHarness-macOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.worlds.test.collaboration.macos.uitests
        TEST_TARGET_NAME: CollaborationHarness-macOS
schemes:
  CollaborationHarness-macOS:
    build:
      targets:
        CollaborationHarness-macOS: all
        CollaborationHarness-macOS-UITests: [test]
    test:
      targets: [CollaborationHarness-macOS-UITests]
