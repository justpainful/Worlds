name: WorldsRejectedArchiveHarness
options:
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    GENERATE_INFOPLIST_FILE: YES
    CODE_SIGNING_ALLOWED: NO
packages:
  WorldsCore:
    path: ../WorldsCore
targets:
  RejectedArchiveHarness-iOS:
    type: application
    platform: iOS
    sources:
      - App
      - path: Fixtures/worlds-collab-v11.db
        buildPhase: resources
      - path: Fixtures/rejected-comments-yjs.bin
        buildPhase: resources
    dependencies:
      - package: WorldsCore
        product: WorldsCollaboration
      - package: WorldsCore
        product: WorldsRejectedArchives
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.worlds.test.rejectedarchive.ios
        TARGETED_DEVICE_FAMILY: "1,2"
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
  RejectedArchiveHarness-iOS-UITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies:
      - target: RejectedArchiveHarness-iOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.worlds.test.rejectedarchive.ios.uitests
        TEST_TARGET_NAME: RejectedArchiveHarness-iOS
  RejectedArchiveHarness-macOS:
    type: application
    platform: macOS
    sources:
      - App
      - path: Fixtures/worlds-collab-v11.db
        buildPhase: resources
      - path: Fixtures/rejected-comments-yjs.bin
        buildPhase: resources
    dependencies:
      - package: WorldsCore
        product: WorldsCollaboration
      - package: WorldsCore
        product: WorldsRejectedArchives
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.worlds.test.rejectedarchive.macos
  RejectedArchiveHarness-macOS-UITests:
    type: bundle.ui-testing
    platform: macOS
    sources: [UITests]
    dependencies:
      - target: RejectedArchiveHarness-macOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.worlds.test.rejectedarchive.macos.uitests
        TEST_TARGET_NAME: RejectedArchiveHarness-macOS
schemes:
  RejectedArchiveHarness-iOS:
    build:
      targets:
        RejectedArchiveHarness-iOS: all
        RejectedArchiveHarness-iOS-UITests: [test]
    test:
      targets: [RejectedArchiveHarness-iOS-UITests]
  RejectedArchiveHarness-macOS:
    build:
      targets:
        RejectedArchiveHarness-macOS: all
        RejectedArchiveHarness-macOS-UITests: [test]
    test:
      targets: [RejectedArchiveHarness-macOS-UITests]
