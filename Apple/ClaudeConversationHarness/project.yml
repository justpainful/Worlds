name: WorldsClaudeConversationHarness
options:
  deploymentTarget:
    macOS: "14.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    GENERATE_INFOPLIST_FILE: YES
    CODE_SIGNING_ALLOWED: NO
packages:
  WorldsCore:
    path: ../WorldsCore
targets:
  ClaudeConversationHarness-macOS:
    type: application
    platform: macOS
    sources:
      - App
      - path: Fixtures/worlds-v11.db
        buildPhase: resources
    dependencies:
      - package: WorldsCore
        product: WorldsAI
      - package: WorldsCore
        product: WorldsAIConversation
      - package: WorldsCore
        product: WorldsAIViews
      - package: WorldsCore
        product: WorldsAIConversationBridge
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.worlds.test.claudeconversation.macos
schemes:
  ClaudeConversationHarness-macOS:
    build:
      targets:
        ClaudeConversationHarness-macOS: all
