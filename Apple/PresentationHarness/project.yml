name: WorldsPresentationHarness
options:
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    GENERATE_INFOPLIST_FILE: YES
    CODE_SIGNING_ALLOWED: NO
packages:
  WorldsCore:
    path: ../WorldsCore
targets:
  PresentationHarness-iOS:
    type: application
    platform: iOS
    sources:
      - App
      - path: ../WorldsCore/Sources/WorldsPresentationSession/PresentationSession.swift
      - path: ../ProjectEditorHarness/Fixtures/worlds-v11.db
        buildPhase: resources
    dependencies:
      - package: WorldsCore
        product: WorldsModels
      - package: WorldsCore
        product: WorldsPresentations
      - package: WorldsCore
        product: WorldsPresentationPersistence
      - package: WorldsCore
        product: WorldsNativeWrites
      - package: WorldsCore
        product: WorldsLocalImport
      - sdk: libsqlite3.tbd
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.worlds.test.presentation.ios
        TARGETED_DEVICE_FAMILY: "1,2"
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
  PresentationHarness-macOS:
    type: application
    platform: macOS
    sources:
      - App
      - path: ../WorldsCore/Sources/WorldsPresentationSession/PresentationSession.swift
      - path: ../ProjectEditorHarness/Fixtures/worlds-v11.db
        buildPhase: resources
    dependencies:
      - package: WorldsCore
        product: WorldsModels
      - package: WorldsCore
        product: WorldsPresentations
      - package: WorldsCore
        product: WorldsPresentationPersistence
      - package: WorldsCore
        product: WorldsNativeWrites
      - package: WorldsCore
        product: WorldsLocalImport
      - sdk: libsqlite3.tbd
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.worlds.test.presentation.macos
  PresentationHarness-iOS-UITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies:
      - target: PresentationHarness-iOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.worlds.test.presentation.ios.uitests
        TEST_TARGET_NAME: PresentationHarness-iOS
  PresentationHarness-macOS-UITests:
    type: bundle.ui-testing
    platform: macOS
    sources: [UITests]
    dependencies:
      - target: PresentationHarness-macOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.worlds.test.presentation.macos.uitests
        TEST_TARGET_NAME: PresentationHarness-macOS
schemes:
  PresentationHarness-iOS:
    build:
      targets:
        PresentationHarness-iOS: all
        PresentationHarness-iOS-UITests: [test]
    test:
      targets: [PresentationHarness-iOS-UITests]
  PresentationHarness-macOS:
    build:
      targets:
        PresentationHarness-macOS: all
        PresentationHarness-macOS-UITests: [test]
    test:
      targets: [PresentationHarness-macOS-UITests]
