name: WorldsPageEditorHarness
options:
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    GENERATE_INFOPLIST_FILE: YES
    CODE_SIGNING_ALLOWED: NO
packages:
  WorldsCore:
    path: ../WorldsCore
targets:
  PageEditorHarness-iOS:
    type: application
    platform: iOS
    sources:
      - App
      - path: Fixtures/worlds-v11.db
        buildPhase: resources
    dependencies:
      - package: WorldsCore
        product: WorldsLocalImport
      - package: WorldsCore
        product: WorldsEditorPersistence
      - package: WorldsCore
        product: WorldsNativeEditor
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.worlds.test.pageeditor.ios
        TARGETED_DEVICE_FAMILY: "1,2"
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
  PageEditorHarness-macOS:
    type: application
    platform: macOS
    sources:
      - App
      - path: Fixtures/worlds-v11.db
        buildPhase: resources
    dependencies:
      - package: WorldsCore
        product: WorldsLocalImport
      - package: WorldsCore
        product: WorldsEditorPersistence
      - package: WorldsCore
        product: WorldsNativeEditor
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.worlds.test.pageeditor.macos
  PageEditorHarness-iOS-UITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies:
      - target: PageEditorHarness-iOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.worlds.test.pageeditor.ios.uitests
        TEST_TARGET_NAME: PageEditorHarness-iOS
  PageEditorHarness-macOS-UITests:
    type: bundle.ui-testing
    platform: macOS
    sources: [UITests]
    dependencies:
      - target: PageEditorHarness-macOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.worlds.test.pageeditor.macos.uitests
        TEST_TARGET_NAME: PageEditorHarness-macOS
schemes:
  PageEditorHarness-iOS:
    build:
      targets:
        PageEditorHarness-iOS: all
        PageEditorHarness-iOS-UITests: [test]
    test:
      targets: [PageEditorHarness-iOS-UITests]
  PageEditorHarness-macOS:
    build:
      targets:
        PageEditorHarness-macOS: all
        PageEditorHarness-macOS-UITests: [test]
    test:
      targets: [PageEditorHarness-macOS-UITests]
