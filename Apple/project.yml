name: Worlds
options:
  minimumXcodeGenVersion: 2.42.0
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    GENERATE_INFOPLIST_FILE: YES
    PRODUCT_NAME: Worlds
    CODE_SIGNING_ALLOWED: NO
    "EXCLUDED_SOURCE_FILE_NAMES[config=Release]": "worlds-v1-fixture.db search-ui-fixture.db reader-ui-fixture.db"
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: "0.1.0"
packages:
  WorldsCore:
    path: WorldsCore
targets:
  Worlds-iOS:
    type: application
    platform: iOS
    sources:
      - path: App
        excludes:
          - DESIGN.md
          - UI_TEST_COVERAGE.md
          - UITests
      - path: WorldsCore/Tests/WorldsPersistenceTests/worlds-v1-fixture.db
        buildPhase: resources
      - path: App/UITests/Fixtures/search-ui-fixture.db
        buildPhase: resources
      - path: App/UITests/Fixtures/reader-ui-fixture.db
        buildPhase: resources
    dependencies:
      - package: WorldsCore
        product: WorldsModels
      - package: WorldsCore
        product: WorldsSyncWire
      - package: WorldsCore
        product: WorldsPersistence
      - package: WorldsCore
        product: WorldsSearch
      - package: WorldsCore
        product: WorldsLocalImport
      - package: WorldsCore
        product: WorldsNativeWrites
      - package: WorldsCore
        product: WorldsResourceRepositories
      - package: WorldsCore
        product: WorldsProjectEditingViews
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.worlds.native.ios
        TARGETED_DEVICE_FAMILY: "1,2"
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
  Worlds-macOS:
    type: application
    platform: macOS
    sources:
      - path: App
        excludes:
          - DESIGN.md
          - UI_TEST_COVERAGE.md
          - UITests
      - path: WorldsCore/Tests/WorldsPersistenceTests/worlds-v1-fixture.db
        buildPhase: resources
      - path: App/UITests/Fixtures/search-ui-fixture.db
        buildPhase: resources
      - path: App/UITests/Fixtures/reader-ui-fixture.db
        buildPhase: resources
    dependencies:
      - package: WorldsCore
        product: WorldsModels
      - package: WorldsCore
        product: WorldsSyncWire
      - package: WorldsCore
        product: WorldsPersistence
      - package: WorldsCore
        product: WorldsSearch
      - package: WorldsCore
        product: WorldsLocalImport
      - package: WorldsCore
        product: WorldsNativeWrites
      - package: WorldsCore
        product: WorldsResourceRepositories
      - package: WorldsCore
        product: WorldsProjectEditingViews
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.worlds.native.macos
  Worlds-iOS-UITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - App/UITests
    dependencies:
      - target: Worlds-iOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.worlds.native.ios.uitests
        PRODUCT_NAME: Worlds-iOS-UITests
        PRODUCT_MODULE_NAME: WorldsIOSUITests
        TEST_TARGET_NAME: Worlds-iOS
  Worlds-macOS-UITests:
    type: bundle.ui-testing
    platform: macOS
    sources:
      - App/UITests
    dependencies:
      - target: Worlds-macOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.worlds.native.macos.uitests
        PRODUCT_NAME: Worlds-macOS-UITests
        PRODUCT_MODULE_NAME: WorldsMacOSUITests
        TEST_TARGET_NAME: Worlds-macOS
schemes:
  Worlds-iOS:
    build:
      targets:
        Worlds-iOS: all
        Worlds-iOS-UITests: [test]
    test:
      config: Debug
      targets:
        - Worlds-iOS-UITests
  Worlds-macOS:
    build:
      targets:
        Worlds-macOS: all
        Worlds-macOS-UITests: [test]
    test:
      config: Debug
      targets:
        - Worlds-macOS-UITests
