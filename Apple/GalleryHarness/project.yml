name: WorldsGalleryHarness
options:
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    GENERATE_INFOPLIST_FILE: YES
    CODE_SIGNING_ALLOWED: NO
packages:
  WorldsCore:
    path: ../WorldsCore
targets:
  GalleryHarness-iOS:
    type: application
    platform: iOS
    sources:
      - App
      - path: ../ProjectEditorHarness/Fixtures/worlds-v11.db
        buildPhase: resources
    dependencies:
      - package: WorldsCore
        product: WorldsGallery
      - package: WorldsCore
        product: WorldsResourceRepositories
      - package: WorldsCore
        product: WorldsNativeWrites
      - package: WorldsCore
        product: WorldsLocalImport
      - sdk: libsqlite3.tbd
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.worlds.test.gallery.ios
        TARGETED_DEVICE_FAMILY: "1,2"
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
  GalleryHarness-macOS:
    type: application
    platform: macOS
    sources:
      - App
      - path: ../ProjectEditorHarness/Fixtures/worlds-v11.db
        buildPhase: resources
    dependencies:
      - package: WorldsCore
        product: WorldsGallery
      - package: WorldsCore
        product: WorldsResourceRepositories
      - package: WorldsCore
        product: WorldsNativeWrites
      - package: WorldsCore
        product: WorldsLocalImport
      - sdk: libsqlite3.tbd
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.worlds.test.gallery.macos
  GalleryHarness-iOS-UITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies:
      - target: GalleryHarness-iOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.worlds.test.gallery.ios.uitests
        TEST_TARGET_NAME: GalleryHarness-iOS
  GalleryHarness-macOS-UITests:
    type: bundle.ui-testing
    platform: macOS
    sources: [UITests]
    dependencies:
      - target: GalleryHarness-macOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.worlds.test.gallery.macos.uitests
        TEST_TARGET_NAME: GalleryHarness-macOS
schemes:
  GalleryHarness-iOS:
    build:
      targets:
        GalleryHarness-iOS: all
        GalleryHarness-iOS-UITests: [test]
    test:
      targets: [GalleryHarness-iOS-UITests]
  GalleryHarness-macOS:
    build:
      targets:
        GalleryHarness-macOS: all
        GalleryHarness-macOS-UITests: [test]
    test:
      targets: [GalleryHarness-macOS-UITests]
