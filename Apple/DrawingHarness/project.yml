name: WorldsDrawingHarness
options:
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) WORLDS_DRAWING_HARNESS"
    GENERATE_INFOPLIST_FILE: YES
    CODE_SIGNING_ALLOWED: NO
packages:
  WorldsCore:
    path: ../WorldsCore
targets:
  DrawingHarness-iOS:
    type: application
    platform: iOS
    sources:
      - App
      - Shared
      - path: ../ProjectEditorHarness/Fixtures/worlds-v11.db
        buildPhase: resources
    dependencies:
      - package: WorldsCore
        product: WorldsDrawing
      - package: WorldsCore
        product: WorldsDrawingNativeWrites
      - package: WorldsCore
        product: WorldsDrawingStrokeSession
      - package: WorldsCore
        product: WorldsDrawingPencilInput
      - sdk: libsqlite3.tbd
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.worlds.test.drawing.ios
        TARGETED_DEVICE_FAMILY: "1,2"
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
  DrawingHarness-macOS:
    type: application
    platform: macOS
    sources:
      - App
      - Shared
      - path: ../ProjectEditorHarness/Fixtures/worlds-v11.db
        buildPhase: resources
    dependencies:
      - package: WorldsCore
        product: WorldsDrawing
      - package: WorldsCore
        product: WorldsDrawingNativeWrites
      - package: WorldsCore
        product: WorldsDrawingStrokeSession
      - package: WorldsCore
        product: WorldsDrawingPencilInput
      - sdk: libsqlite3.tbd
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.worlds.test.drawing.macos
  DrawingHarness-macOS-UITests:
    type: bundle.ui-testing
    platform: macOS
    sources: [UITests]
    dependencies:
      - target: DrawingHarness-macOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.worlds.test.drawing.macos.uitests
        TEST_TARGET_NAME: DrawingHarness-macOS
  DrawingHarness-iOS-UITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies:
      - target: DrawingHarness-iOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.worlds.test.drawing.ios.uitests
        TEST_TARGET_NAME: DrawingHarness-iOS
schemes:
  DrawingHarness-iOS:
    build:
      targets:
        DrawingHarness-iOS: all
        DrawingHarness-iOS-UITests: [test]
    test:
      targets: [DrawingHarness-iOS-UITests]
  DrawingHarness-macOS:
    build:
      targets:
        DrawingHarness-macOS: all
        DrawingHarness-macOS-UITests: [test]
    test:
      targets: [DrawingHarness-macOS-UITests]
