name: WorldsStreamEditingExperimental
options:
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    GENERATE_INFOPLIST_FILE: YES
    CODE_SIGNING_ALLOWED: NO
    SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) DEBUG WORLDS_EXPERIMENTAL_LOCAL_COPY WORLDS_EXPERIMENTAL_STREAM_EDITOR"
packages:
  WorldsCore:
    path: ../WorldsCore
targetTemplates:
  LocalCopyApp:
    type: application
    sources:
      - path: ../App
        excludes: [UITests, DESIGN.md, UI_TEST_COVERAGE.md]
      - path: Fixtures/worlds-v11.db
        buildPhase: resources
    dependencies:
      - package: WorldsCore
        product: WorldsModels
      - package: WorldsCore
        product: WorldsSyncWire
      - package: WorldsCore
        product: WorldsPersistence
      - package: WorldsCore
        product: WorldsSearch
      - package: WorldsCore
        product: WorldsMedia
      - package: WorldsCore
        product: WorldsMediaViews
      - package: WorldsCore
        product: WorldsLocalImport
      - package: WorldsCore
        product: WorldsNativeWrites
      - package: WorldsCore
        product: WorldsResourceRepositories
      - package: WorldsCore
        product: WorldsProjectEditingViews
  LocalCopyTests:
    type: bundle.ui-testing
    sources: [../App/UITests/WorldsLocalStreamUITests.swift]
targets:
  LocalCopy-iOS:
    templates: [LocalCopyApp]
    platform: iOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.worlds.test.localcopy.ios
        TARGETED_DEVICE_FAMILY: "1,2"
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
  LocalCopy-macOS:
    templates: [LocalCopyApp]
    platform: macOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.worlds.test.localcopy.macos
  LocalCopy-iOS-UITests:
    templates: [LocalCopyTests]
    platform: iOS
    dependencies: [{target: LocalCopy-iOS}]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.worlds.test.localcopy.ios.uitests
        TEST_TARGET_NAME: LocalCopy-iOS
  LocalCopy-macOS-UITests:
    templates: [LocalCopyTests]
    platform: macOS
    dependencies: [{target: LocalCopy-macOS}]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.worlds.test.localcopy.macos.uitests
        TEST_TARGET_NAME: LocalCopy-macOS
schemes:
  LocalCopy-iOS:
    build:
      targets: {LocalCopy-iOS: all, LocalCopy-iOS-UITests: [test]}
    test:
      config: Debug
      targets: [LocalCopy-iOS-UITests]
  LocalCopy-macOS:
    build:
      targets: {LocalCopy-macOS: all, LocalCopy-macOS-UITests: [test]}
    test:
      config: Debug
      targets: [LocalCopy-macOS-UITests]
