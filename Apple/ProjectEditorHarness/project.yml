name: WorldsProjectEditorHarness
options:
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    GENERATE_INFOPLIST_FILE: YES
    CODE_SIGNING_ALLOWED: NO
packages:
  WorldsCore:
    path: ../WorldsCore
targets:
  ProjectEditorHarness-iOS:
    type: application
    platform: iOS
    sources:
      - App
      - path: Fixtures/worlds-v11.db
        buildPhase: resources
    dependencies:
      - package: WorldsCore
        product: WorldsProjectEditingViews
      - package: WorldsCore
        product: WorldsResourceRepositories
      - package: WorldsCore
        product: WorldsNativeWrites
      - package: WorldsCore
        product: WorldsLocalImport
      - sdk: libsqlite3.tbd
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.worlds.test.projecteditor.ios
        TARGETED_DEVICE_FAMILY: "1,2"
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
  ProjectEditorHarness-macOS:
    type: application
    platform: macOS
    sources:
      - App
      - path: Fixtures/worlds-v11.db
        buildPhase: resources
    dependencies:
      - package: WorldsCore
        product: WorldsProjectEditingViews
      - package: WorldsCore
        product: WorldsResourceRepositories
      - package: WorldsCore
        product: WorldsNativeWrites
      - package: WorldsCore
        product: WorldsLocalImport
      - sdk: libsqlite3.tbd
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.worlds.test.projecteditor.macos
  ProjectEditorHarness-iOS-UITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies:
      - target: ProjectEditorHarness-iOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.worlds.test.projecteditor.ios.uitests
        TEST_TARGET_NAME: ProjectEditorHarness-iOS
  ProjectEditorHarness-macOS-UITests:
    type: bundle.ui-testing
    platform: macOS
    sources: [UITests]
    dependencies:
      - target: ProjectEditorHarness-macOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.worlds.test.projecteditor.macos.uitests
        TEST_TARGET_NAME: ProjectEditorHarness-macOS
schemes:
  ProjectEditorHarness-iOS:
    build:
      targets:
        ProjectEditorHarness-iOS: all
        ProjectEditorHarness-iOS-UITests: [test]
    test:
      targets: [ProjectEditorHarness-iOS-UITests]
  ProjectEditorHarness-macOS:
    build:
      targets:
        ProjectEditorHarness-macOS: all
        ProjectEditorHarness-macOS-UITests: [test]
    test:
      targets: [ProjectEditorHarness-macOS-UITests]
