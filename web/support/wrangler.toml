# The support site at support.enterworlds.space (docs/admin/PLAN.md, phase 2).
# Static; requests go to the identity service's /support API.
# Deploy: node web/support/build-articles.mjs && npx vite build --config web/support/vite.config.ts,
# then npx wrangler deploy -c web/support/wrangler.toml
name = "worlds-support"
compatibility_date = "2026-08-01"

[assets]
directory = "./dist"
not_found_handling = "single-page-application"

[[routes]]
pattern = "support.enterworlds.space"
custom_domain = true
