[package]
name = "worlds"
version = "0.1.0"
description = "Worlds: a local-first personal workspace"
edition = "2021"
default-run = "worlds"

[lib]
name = "worlds_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-autostart = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.37", features = ["bundled", "serde_json"] }
uuid = { version = "1", features = ["v4", "v7"] }
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "process", "sync", "io-util", "net"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
mime_guess = "2"
imagesize = "0.13"
percent-encoding = "2"
unicode-bidi = "0.3"
dirs = "6"
base64 = "0.22"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.60", features = ["Win32_Foundation", "Win32_Graphics_Dwm", "Win32_UI_WindowsAndMessaging", "Win32_System_Console", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_Security", "Win32_UI_Controls"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
strip = true
