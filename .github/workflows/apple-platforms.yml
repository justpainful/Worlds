  experimental-local-identity:
    name: Experimental isolated identity Worker integration
    runs-on: macos-26
    timeout-minutes: 20
    env:
      WORLDS_REQUIRE_LIVE_IDENTITY: "1"
      WORLDS_LIVE_IDENTITY_URL: http://127.0.0.1:18792
      WORLDS_LIVE_MAILBOX_URL: http://127.0.0.1:18793
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: services/identity/pnpm-lock.yaml
      - name: Select Xcode
        run: sudo xcode-select --switch /Applications/Xcode_26.6.app/Contents/Developer
      - name: Install isolated service
        working-directory: services/identity
        run: pnpm install --frozen-lockfile
      - name: Run local service and identity client test
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p logs "$RUNNER_TEMP/identity-fixture"
          node -e 'const c=require("node:crypto"),f=require("node:fs");const k=c.generateKeyPairSync("ed25519").privateKey.export({format:"jwk"});f.writeFileSync(process.argv[1],"JWT_PRIVATE_JWK="+JSON.stringify(k)+"\nEMAIL_WEBHOOK_URL=http://127.0.0.1:18793/mail\n",{mode:0o600})' "$RUNNER_TEMP/identity-fixture/worker.env"
          cd services/identity
          pnpm exec wrangler d1 migrations apply worlds-identity --local --persist-to "$RUNNER_TEMP/identity-fixture/d1" > /dev/null
          node ../../Apple/IdentityHarness/mailbox.cjs > /dev/null 2>&1 & mailbox_pid=$!
          pnpm exec wrangler dev --ip 127.0.0.1 --port 18792 --inspector-port 18794 --persist-to "$RUNNER_TEMP/identity-fixture/d1" --env-file "$RUNNER_TEMP/identity-fixture/worker.env" > "$RUNNER_TEMP/identity-fixture/worker.log" 2>&1 & worker_pid=$!
          trap 'kill "$worker_pid" "$mailbox_pid" 2>/dev/null || true; rm -f "$RUNNER_TEMP/identity-fixture/worker.env" "$RUNNER_TEMP/identity-fixture/worker.log"' EXIT
          ready=0
          for attempt in {1..60}; do
            if curl --fail --silent http://127.0.0.1:18793/health > /dev/null && curl --fail --silent http://127.0.0.1:18792/.well-known/jwks.json > /dev/null; then ready=1; break; fi
            sleep 1
          done
          if [ "$ready" != 1 ]; then
            echo "Local identity fixture failed readiness"
            for service in mailbox worker; do
              case "$service" in
                mailbox) pid="$mailbox_pid"; url=http://127.0.0.1:18793/health ;;
                worker) pid="$worker_pid"; url=http://127.0.0.1:18792/.well-known/jwks.json ;;
              esac
              if kill -0 "$pid" 2>/dev/null; then state=running; else state=exited; fi
              http=$(curl --silent --output /dev/null --write-out '%{http_code}' --max-time 3 "$url" || true)
              printf '%s process=%s HTTP=%s\n' "$service" "$state" "$http"
            done
            lsof -nP -iTCP:18792 -iTCP:18793 -iTCP:18794 -sTCP:LISTEN || true
            node -e 'const f=require("node:fs");let s="";try{s=f.readFileSync(process.argv[1],"utf8")}catch{};let c="unclassified";if(s.includes("JWT_PRIVATE_JWK is not configured"))c="missing-key";else if(s.includes("JWT_PRIVATE_JWK must be an Ed25519 private JWK"))c="invalid-key-shape";else if(s.includes("SyntaxError"))c="syntax-error";else if(s.includes("DataError"))c="crypto-data-error";else if(s.includes("NotSupportedError"))c="crypto-unsupported";console.log("Worker error category="+c)' "$RUNNER_TEMP/identity-fixture/worker.log"
            exit 1
          fi
          cd ../..
          swift test --package-path Apple/WorldsCore --filter LiveIdentityServiceTests 2>&1 | tee logs/live-identity.log
          grep -E 'testLocalIdentityEmailRefreshAndRemoteLogout.*passed' logs/live-identity.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Worlds-experimental-local-identity-results
          path: logs/
          if-no-files-found: warn

  collaboration-local-worker:
    name: Rust collaboration with isolated local sync Worker
    runs-on: macos-26
    needs: collaboration-xcframework
    timeout-minutes: 60
    env:
      WORLDS_REQUIRE_COLLABORATION: "1"
      WORLDS_REQUIRE_LIVE_SERVICE: "1"
      WORLDS_COLLAB_DIAGNOSTICS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: services/sync/pnpm-lock.yaml
      - uses: dtolnay/rust-toolchain@1.99.1
      - name: Select Xcode
        run: |
          sudo xcode-select --switch /Applications/Xcode_26.6.app/Contents/Developer
          xcodebuild -version
      - uses: actions/download-artifact@v4
        with:
          name: Worlds-shared-collaboration-xcframework
          path: shared-artifact
      - name: Verify and restore collaboration XCFramework
        shell: bash
        run: |
          set -euo pipefail
          test "$(cat shared-artifact/source-revision)" = "$GITHUB_SHA"
          (cd shared-artifact && shasum -a 256 -c SHA256SUMS)
          mkdir -p logs Apple/WorldsCore/Artifacts
          tar -xzf shared-artifact/collaboration-xcframework.tar.gz -C Apple/WorldsCore/Artifacts
          test -d Apple/WorldsCore/Artifacts/WorldsRustCollaboration.xcframework
      - name: Discover required live Swift test
        shell: bash
        run: |
          set -o pipefail
          swift test --package-path Apple/WorldsCore list 2>&1 | tee logs/local-swift-discovery.log
          grep -q 'testLiveSwiftSessionsConvergeReconnectAndArchiveRefusal' logs/local-swift-discovery.log
          grep -q 'testLiveAwarenessExchangeAndDisconnect' logs/local-swift-discovery.log
          grep -q 'testLiveCheckedEditorsConvergeAfterReconnect' logs/local-swift-discovery.log
          grep -q 'testDiagnosticDefaultTransportLoopbackHandshake' logs/local-swift-discovery.log
          grep -q 'testDiagnosticSharedSessionLoopbackHandshake' logs/local-swift-discovery.log
          grep -q 'testDiagnosticSingleClientWithPresence' logs/local-swift-discovery.log
          grep -q 'testDiagnosticTwoClientsWithoutPresence' logs/local-swift-discovery.log
          grep -q 'testDiagnosticDefaultFactoryWithoutPresence' logs/local-swift-discovery.log
          grep -q 'testDiagnosticExplicitFactoryWithPresence' logs/local-swift-discovery.log
      - name: Generate isolated collaboration harness
        run: |
          brew install xcodegen coreutils
          xcodegen generate --spec Apple/CollaborationHarness/project.yml
      - name: Install isolated Worker dependencies
        working-directory: services/sync
        run: pnpm install --frozen-lockfile
      - name: Run isolated local service integration
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p logs
          cd services/sync
          pnpm exec wrangler dev -c dev/identity.toml --port 18791 --inspector-port 19891 --ip 127.0.0.1 --persist-to "$RUNNER_TEMP/identity" > "$GITHUB_WORKSPACE/logs/local-identity.log" 2>&1 &
          identity_pid=$!
          sync_pid=""
          trap 'kill "$identity_pid" ${sync_pid:+"$sync_pid"} 2>/dev/null || true' EXIT
          ready=0
          for attempt in $(seq 1 90); do
            if curl -fsS http://127.0.0.1:18791/.well-known/jwks.json >/dev/null 2>&1; then ready=1; break; fi
            sleep 1
          done
          if [ "$ready" != 1 ]; then
            echo "Local service readiness failed; listening ports follow" >&2
            lsof -nP -iTCP -sTCP:LISTEN >&2 || true
            exit 1
          fi
          pnpm exec wrangler dev --env local --port 18790 --inspector-port 19890 --ip 127.0.0.1 --persist-to "$RUNNER_TEMP/sync" --var JWKS_URL:http://127.0.0.1:18791/.well-known/jwks.json > "$GITHUB_WORKSPACE/logs/local-sync.log" 2>&1 &
          sync_pid=$!
          editor_token=$(curl -fsS 'http://127.0.0.1:18791/dev/token?sub=editor' | jq -er .token)
          viewer_token=$(curl -fsS 'http://127.0.0.1:18791/dev/token?sub=viewer' | jq -er .token)
          curl -fsS -X POST http://127.0.0.1:18791/dev/grant -H 'Content-Type: application/json' \
            --data '{"userId":"viewer","workspaceId":"fixture-workspace","docId":null,"level":"view"}' >/dev/null
          ready=0
          for attempt in $(seq 1 90); do
            if curl -fsS -H "Authorization: Bearer $editor_token" http://127.0.0.1:18790/v1/workspaces/fixture-workspace/docs/probe/versions >/dev/null 2>&1; then ready=1; break; fi
            sleep 1
          done
          if [ "$ready" != 1 ]; then
            echo "Local service readiness failed; listening ports follow" >&2
            lsof -nP -iTCP -sTCP:LISTEN >&2 || true
            exit 1
          fi
          cd "$GITHUB_WORKSPACE"
          WORLDS_LIVE_SYNC_URL=ws://127.0.0.1:18790 \
          WORLDS_LIVE_EDITOR_TOKEN="$editor_token" WORLDS_LIVE_VIEWER_TOKEN="$viewer_token" \
            cargo test --locked --manifest-path Apple/RustCollaboration/Cargo.toml --test live_service -- --ignored --nocapture \
            2>&1 | tee logs/collaboration-local-worker.log
          grep -q 'live_native_replica_offline_merge_reconnect_and_refusal ... ok' logs/collaboration-local-worker.log
          cargo test --locked --manifest-path Apple/RustCollaboration/Cargo.toml --test interop -- --nocapture \
            2>&1 | tee logs/collaboration-interop-rust.log
          grep -q 'concurrent_ffi_document_lifetimes_preserve_buffers ... ok' logs/collaboration-interop-rust.log
          cargo test --locked --manifest-path Apple/RustCollaboration/Cargo.toml --test editor -- --nocapture \
            2>&1 | tee logs/collaboration-editor-rust.log
          grep -q 'concurrent_insertions_converge_without_losing_either_edit ... ok' logs/collaboration-editor-rust.log
          grep -q 'projection_uses_live_yjs_and_rejects_unsupported_content ... ok' logs/collaboration-editor-rust.log
          grep -q 'rejects_stale_content_surrogate_boundaries_and_rich_formatting ... ok' logs/collaboration-editor-rust.log
          cargo test --locked --manifest-path Apple/RustCollaboration/Cargo.toml --test rejected_comments -- --nocapture 2>&1 | tee logs/rejected-comments-rust.log
          grep -E 'yjs_fixture_extracts_only_visible_owner_drawing_comments.*ok' logs/rejected-comments-rust.log
          grep -E 'ffi_extracts_same_owner_filtered_comments.*ok' logs/rejected-comments-rust.log
          cargo test --locked --manifest-path Apple/RustCollaboration/Cargo.toml --test store -- --nocapture \
            2>&1 | tee logs/collaboration-store-rust.log
          grep -q 'editor_transaction_rejects_stale_and_rolls_back_outbox_failure ... ok' logs/collaboration-store-rust.log
          grep -q 'replaced_database_path_is_rejected_without_writing_either_database ... ok' logs/collaboration-store-rust.log
          grep -q 'delete_transaction_preserves_outbox_on_failure_and_rejects_stale_or_viewer ... ok' logs/collaboration-store-rust.log
          grep -q 'formatting_transaction_is_durable_and_refuses_stale_or_readonly ... ok' logs/collaboration-store-rust.log
          grep -q 'editor_ffi_commits_and_reports_stale_base ... ok' logs/collaboration-store-rust.log
          grep -q 'parallel_fixtures_have_distinct_databases_and_survive_peer_cleanup ... ok' logs/collaboration-store-rust.log
          grep -q 'rejected_archive_ffi_returns_snapshot_and_rechecks_access ... ok' logs/collaboration-store-rust.log
          grep -q 'rejected_archive_read_is_owned_authorized_and_never_requeues ... ok' logs/collaboration-store-rust.log
          grep -q 'rejected_archive_paginates_without_leaking_other_accounts ... ok' logs/collaboration-store-rust.log
          harness_status=0
          if WORLDS_LIVE_SYNC_URL=ws://127.0.0.1:18790 \
            WORLDS_LIVE_EDITOR_TOKEN="$editor_token" WORLDS_LIVE_VIEWER_TOKEN="$viewer_token" \
            gtimeout --kill-after=30s 600s xcodebuild -project Apple/CollaborationHarness/WorldsCollaborationHarness.xcodeproj \
            -scheme CollaborationHarness-macOS -destination 'platform=macOS' \
            -resultBundlePath "$GITHUB_WORKSPACE/collaboration-harness.xcresult" \
            CODE_SIGNING_ALLOWED=NO test 2>&1 | tee logs/collaboration-harness.log; then
            grep -E 'testLocalCollaborationScenario.*passed' logs/collaboration-harness.log || harness_status=1
          else
            harness_status=1
          fi
          diagnostic_status=0
          for diagnostic in testDiagnosticDefaultTransportLoopbackHandshake testDiagnosticSharedSessionLoopbackHandshake testDiagnosticSingleClientWithPresence testDiagnosticTwoClientsWithoutPresence testDiagnosticDefaultFactoryWithoutPresence testDiagnosticExplicitFactoryWithPresence; do
            if WORLDS_LIVE_SYNC_URL=ws://127.0.0.1:18790 \
              WORLDS_LIVE_EDITOR_TOKEN="$editor_token" WORLDS_LIVE_VIEWER_TOKEN="$viewer_token" \
              swift test --package-path Apple/WorldsCore --filter "$diagnostic" \
              2>&1 | tee "logs/${diagnostic}.log"; then
              grep -E "Test Case .*${diagnostic}.*passed" "logs/${diagnostic}.log" || diagnostic_status=1
            else
              diagnostic_status=1
            fi
          done
          if WORLDS_LIVE_SYNC_URL=ws://127.0.0.1:18790 \
            WORLDS_LIVE_EDITOR_TOKEN="$editor_token" WORLDS_LIVE_VIEWER_TOKEN="$viewer_token" \
            swift test --package-path Apple/WorldsCore --filter LiveWorkerTests \
            2>&1 | tee logs/collaboration-live-swift.log; then
            :
          else
            # Diagnostic only: preserve the original failure, even when debugger access is denied.
            WORLDS_LIVE_SYNC_URL=ws://127.0.0.1:18790 \
              WORLDS_LIVE_EDITOR_TOKEN="$editor_token" WORLDS_LIVE_VIEWER_TOKEN="$viewer_token" \
              python3 -c 'import subprocess; subprocess.run(["xcrun","lldb","--batch","-o","run","-k","thread backtrace all","--","/Applications/Xcode_26.6.app/Contents/Developer/usr/bin/xctest","-XCTest","WorldsCollaborationTests.TransportDiagnosticsTests/testDiagnosticSingleClientWithPresence","Apple/WorldsCore/.build/arm64-apple-macosx/debug/WorldsCorePackageTests.xctest"],timeout=90)' > logs/collaboration-lldb.log 2>&1 || true
            exit 1
          fi
          grep -q 'testLiveSwiftSessionsConvergeReconnectAndArchiveRefusal' logs/collaboration-live-swift.log
          grep -q 'testLiveAwarenessExchangeAndDisconnect' logs/collaboration-live-swift.log
          grep -q 'testLiveCheckedEditorsConvergeAfterReconnect' logs/collaboration-live-swift.log
          grep -E 'testLiveWorkerPongDoesNotCloseBinaryTransport.*passed' logs/collaboration-live-swift.log
          grep -Eq 'Executed 4 tests, with 0 failures' logs/collaboration-live-swift.log
          test "$diagnostic_status" = 0
          test "$harness_status" = 0
      - name: Collect XCTest crash reports
        if: failure()
        shell: bash
        run: |
          mkdir -p logs/crash-reports
          find "$HOME/Library/Logs/DiagnosticReports" -maxdepth 1 -type f \
            \( -name 'xctest*.ips' -o -name 'xctest*.crash' \) \
            -exec cp {} logs/crash-reports/ \; 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Worlds-local-collaboration-worker-logs
          path: |
            logs/
            collaboration-harness.xcresult/
          if-no-files-found: warn

  ui-tests:
    name: UI tests ${{ matrix.device }}
    runs-on: macos-26
    env:
      WORLDS_REQUIRE_NATIVE_WRITES: "1"
    needs: ruststore-xcframework
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - device: iPhone
            scheme: Worlds-iOS
            destination: 'platform=iOS Simulator,name=iPhone 17,OS=26.5'
          - device: iPad
            scheme: Worlds-iOS
            destination: 'platform=iOS Simulator,name=iPad (A16),OS=26.5'
          - device: macOS
            scheme: Worlds-macOS
            destination: 'platform=macOS'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: Worlds-shared-ruststore-xcframework
          path: ruststore-artifact
      - name: Verify and restore RustStore
        shell: bash
        run: |
          set -euo pipefail
          test "$(cat ruststore-artifact/source-revision)" = "$GITHUB_SHA"
          (cd ruststore-artifact && shasum -a 256 -c SHA256SUMS)
          mkdir -p Apple/WorldsCore/Artifacts
          tar -xzf ruststore-artifact/ruststore-xcframework.tar.gz -C Apple/WorldsCore/Artifacts
          test -d Apple/WorldsCore/Artifacts/WorldsRustStore.xcframework
      - name: Select Xcode
        run: |
          sudo xcode-select --switch /Applications/Xcode_26.6.app/Contents/Developer
          xcodebuild -version
          xcrun simctl list devices available
      - name: Install project generator and timeout utility
        run: |
          brew install xcodegen
          command -v gtimeout >/dev/null || brew install coreutils
      - name: Generate project
        run: xcodegen generate --spec Apple/project.yml
      - name: Run UI automation and retain results
        shell: bash
        run: |
          set -o pipefail
          mkdir -p logs results
          gtimeout --kill-after=30s 20m xcodebuild -project Apple/Worlds.xcodeproj -scheme '${{ matrix.scheme }}' \
            -configuration Debug -destination '${{ matrix.destination }}' \
            -derivedDataPath "$RUNNER_TEMP/WorldsUI" \
            -resultBundlePath "$GITHUB_WORKSPACE/results/${{ matrix.device }}.xcresult" \
            CODE_SIGNING_ALLOWED=NO test 2>&1 | tee logs/ui-${{ matrix.device }}.log
          grep -Eq 'testRightToLeftNavigationAndReading.*passed' logs/ui-${{ matrix.device }}.log
          grep -Eq 'testReaderShowsStructuredContentAndExpandsToggle.*passed' logs/ui-${{ matrix.device }}.log
          grep -Eq 'testReaderShowsRTLQuotationAndOverflowingList.*passed' logs/ui-${{ matrix.device }}.log
          grep -Eq 'testProjectSummaryAndLinkedPage.*passed' logs/ui-${{ matrix.device }}.log
          grep -Eq 'testArabicProjectSummary.*passed' logs/ui-${{ matrix.device }}.log
          grep -Eq 'testArabicProjectDark.*passed' logs/ui-${{ matrix.device }}.log
          grep -Eq 'testProjectLargeTextDarkRTL.*passed' logs/ui-${{ matrix.device }}.log
          grep -Eq 'testLargeTextSidebarCanReachLastPage.*passed' logs/ui-${{ matrix.device }}.log
          grep -Eq 'testGallerySummary.*passed' logs/ui-${{ matrix.device }}.log
          grep -Eq 'testPresentationSummary.*passed' logs/ui-${{ matrix.device }}.log
          grep -Eq 'testFileSummary.*passed' logs/ui-${{ matrix.device }}.log
          grep -Eq 'testStreamPlaybackFailureCanBeRetried.*passed' logs/ui-${{ matrix.device }}.log
          grep -Eq 'testDashStreamExplainsUnsupportedPlayback.*passed' logs/ui-${{ matrix.device }}.log
          grep -Eq 'testStreamUsesStoredFormatWhenExtensionConflicts.*passed' logs/ui-${{ matrix.device }}.log
          if [[ "${{ matrix.device }}" == "macOS" ]]; then
            grep -Eq 'testLargeReaderWindow.*passed' logs/ui-${{ matrix.device }}.log
          fi
      - name: Export screenshot attachments
        if: always()
        shell: bash
        run: |
          result="results/${{ matrix.device }}.xcresult"
          if [ -d "$result" ]; then
            mkdir -p screenshots
            xcrun xcresulttool export attachments --path "$result" --output-path screenshots
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Worlds-${{ matrix.device }}-UI-results
          path: |
            results/
            screenshots/
            logs/
            Apple/App/UI_TEST_COVERAGE.md
          if-no-files-found: warn

  package-ios:
    name: Package incomplete Worlds ${{ matrix.device }}
    runs-on: macos-26
    env:
      WORLDS_REQUIRE_NATIVE_WRITES: "1"
    timeout-minutes: 20
    needs: [ruststore-xcframework, core-tests, rust-mcp-compatibility, ios, macos, native-writes, collaboration-bridge, collaboration-local-worker, ui-tests, project-editor-harness, experimental-project-links-ui]
    strategy:
      fail-fast: false
      matrix:
        include:
          - device: iPhone
            family: 1
          - device: iPad
            family: 2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: Worlds-shared-ruststore-xcframework
          path: ruststore-artifact
      - name: Verify and restore RustStore
        shell: bash
        run: |
          set -euo pipefail
          test "$(cat ruststore-artifact/source-revision)" = "$GITHUB_SHA"
          (cd ruststore-artifact && shasum -a 256 -c SHA256SUMS)
          mkdir -p Apple/WorldsCore/Artifacts
          tar -xzf ruststore-artifact/ruststore-xcframework.tar.gz -C Apple/WorldsCore/Artifacts
          test -d Apple/WorldsCore/Artifacts/WorldsRustStore.xcframework
      - name: Select pinned Xcode and generate project
        run: |
          sudo xcode-select --switch /Applications/Xcode_26.6.app/Contents/Developer
          xcodebuild -version
          brew install xcodegen
          xcodegen generate --spec Apple/project.yml
      - name: Build and package unsigned device app
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p logs deliverables "$RUNNER_TEMP/package/Payload"
          xcodebuild -project Apple/Worlds.xcodeproj -scheme Worlds-iOS \
            -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/WorldsPackage" TARGETED_DEVICE_FAMILY=${{ matrix.family }} \
            CODE_SIGNING_ALLOWED=NO build 2>&1 | tee logs/ios-package.log
          app="$RUNNER_TEMP/WorldsPackage/Build/Products/Release-iphoneos/Worlds.app"
          test -d "$app"
          test ! -e "$app/worlds-v1-fixture.db"
          test ! -e "$app/search-ui-fixture.db"
          test ! -e "$app/reader-ui-fixture.db"
          test ! -e "$app/worlds-v11.db"
          ditto "$app" "$RUNNER_TEMP/package/Payload/Worlds.app"
          (cd "$RUNNER_TEMP/package" && zip -qry "$GITHUB_WORKSPACE/deliverables/Worlds-${{ matrix.device }}-Unsigned.ipa" Payload)
          xcodebuild -project Apple/Worlds.xcodeproj -scheme Worlds-iOS \
            -configuration Release -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/WorldsSimulatorPackage" TARGETED_DEVICE_FAMILY=${{ matrix.family }} \
            CODE_SIGNING_ALLOWED=NO build 2>&1 | tee logs/ios-simulator-package.log
          simulator_app="$RUNNER_TEMP/WorldsSimulatorPackage/Build/Products/Release-iphonesimulator/Worlds.app"
          test -d "$simulator_app"
          test ! -e "$simulator_app/worlds-v1-fixture.db"
          test ! -e "$simulator_app/search-ui-fixture.db"
          test ! -e "$simulator_app/reader-ui-fixture.db"
          test ! -e "$simulator_app/worlds-v11.db"
          ditto -c -k --sequesterRsrc --keepParent "$simulator_app" "deliverables/Worlds-${{ matrix.device }}-Simulator.zip"
          cat > deliverables/README-INCOMPLETE.txt <<'EOF'
          This is an incomplete development build, not feature parity with Worlds.
          The IPA is unsigned and cannot be installed directly on a physical device.
          It requires appropriate signing and provisioning before device installation.
          A passing build and automated tests do not establish complete visual review.
          EOF
      - uses: actions/upload-artifact@v4
        with:
          name: Worlds-${{ matrix.device }}-INCOMPLETE-unsigned
          path: deliverables/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Worlds-${{ matrix.device }}-package-build-log
          path: logs/
          if-no-files-found: warn

  package-macos:
    name: Package incomplete Worlds macOS
    runs-on: macos-26
    env:
      WORLDS_REQUIRE_NATIVE_WRITES: "1"
    timeout-minutes: 20
    needs: [ruststore-xcframework, core-tests, rust-mcp-compatibility, ios, macos, native-writes, collaboration-bridge, collaboration-local-worker, ui-tests, project-editor-harness, experimental-project-links-ui]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: Worlds-shared-ruststore-xcframework
          path: ruststore-artifact
      - name: Verify and restore RustStore
        shell: bash
        run: |
          set -euo pipefail
          test "$(cat ruststore-artifact/source-revision)" = "$GITHUB_SHA"
          (cd ruststore-artifact && shasum -a 256 -c SHA256SUMS)
          mkdir -p Apple/WorldsCore/Artifacts
          tar -xzf ruststore-artifact/ruststore-xcframework.tar.gz -C Apple/WorldsCore/Artifacts
          test -d Apple/WorldsCore/Artifacts/WorldsRustStore.xcframework
      - name: Select pinned Xcode and generate project
        run: |
          sudo xcode-select --switch /Applications/Xcode_26.6.app/Contents/Developer
          xcodebuild -version
          brew install xcodegen
          xcodegen generate --spec Apple/project.yml
      - name: Build and package unsigned macOS app
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p logs deliverables
          xcodebuild -project Apple/Worlds.xcodeproj -scheme Worlds-macOS \
            -configuration Release -destination 'generic/platform=macOS' \
            -derivedDataPath "$RUNNER_TEMP/WorldsPackage" CODE_SIGNING_ALLOWED=NO build \
            2>&1 | tee logs/macos-package.log
          app="$RUNNER_TEMP/WorldsPackage/Build/Products/Release/Worlds.app"
          test -d "$app"
          test ! -e "$app/Contents/Resources/worlds-v1-fixture.db"
          test ! -e "$app/Contents/Resources/search-ui-fixture.db"
          test ! -e "$app/Contents/Resources/reader-ui-fixture.db"
          test ! -e "$app/Contents/Resources/worlds-v11.db"
          ditto "$app" deliverables/Worlds-macOS-Unsigned.app
          ditto -c -k --sequesterRsrc --keepParent deliverables/Worlds-macOS-Unsigned.app deliverables/Worlds-macOS-Unsigned.zip
          hdiutil create -volname Worlds -srcfolder deliverables/Worlds-macOS-Unsigned.app -ov -format UDZO deliverables/Worlds-macOS-Unsigned.dmg
          cat > deliverables/README-INCOMPLETE.txt <<'EOF'
          This is an incomplete development build, not feature parity with Worlds.
          The macOS app is unsigned and not notarized. Gatekeeper may block it.
          Use the ZIP or DMG to preserve the application bundle and permissions.
          A passing build and automated tests do not establish complete visual review.
          EOF
      - uses: actions/upload-artifact@v4
        with:
          name: Worlds-macOS-INCOMPLETE-unsigned
          path: |
            deliverables/Worlds-macOS-Unsigned.zip
            deliverables/Worlds-macOS-Unsigned.dmg
            deliverables/README-INCOMPLETE.txt
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: Worlds-macOS-INCOMPLETE-app-bundle
          path: deliverables/Worlds-macOS-Unsigned.app/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Worlds-macOS-package-build-log
          path: logs/
          if-no-files-found: warn

  experimental-fixture-bundle:
    name: Experimental fixture-only attachment bundle
    runs-on: macos-26
    timeout-minutes: 40
    env:
      WORLDS_FIXTURE_BUNDLE: "1"
      WORLDS_REQUIRE_NATIVE_WRITES: "1"
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.6.app/Contents/Developer
      - uses: dtolnay/rust-toolchain@1.99.1
      - name: Build fixture-only RustStore
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p logs
          bash Apple/RustStore/scripts/build-apple.sh 2>&1 | tee logs/fixture-build.log
          test -d Apple/WorldsCore/Artifacts/WorldsRustStore.xcframework
      - name: Test isolated Rust FFI
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked --manifest-path Apple/RustStore/Cargo.toml --features fixture-bundle fixture_bundle_ffi_restricts_paths_and_copies_synthetic_data -- --nocapture 2>&1 | tee logs/fixture-rust.log
          grep -E 'fixture_bundle_ffi_restricts_paths_and_copies_synthetic_data.*ok' logs/fixture-rust.log
      - name: Test isolated Swift bridge
        shell: bash
        run: |
          set -euo pipefail
          swift test --package-path Apple/WorldsCore --filter WorldsFixtureBundleImportTests 2>&1 | tee logs/fixture-swift.log
          grep -E 'testFixtureBundleCopiesDataAndLeavesSourceUntouched.*passed' logs/fixture-swift.log
          grep -E 'testMissingAttachmentDoesNotPublishBundle.*passed' logs/fixture-swift.log
      - name: Test fixture harness
        shell: bash
        run: |
          set -euo pipefail
          brew install xcodegen
          xcodegen generate --spec Apple/AttachmentBundleHarness/project.yml
          xcodebuild test -project Apple/AttachmentBundleHarness/WorldsAttachmentBundleHarness.xcodeproj -scheme AttachmentBundleHarness-macOS -destination 'platform=macOS' -resultBundlePath "$PWD/logs/attachment-bundle.xcresult" CODE_SIGNING_ALLOWED=NO 2>&1 | tee logs/fixture-ui.log
          grep -E 'testFixtureSelectionAndRealBundleImport.*passed' logs/fixture-ui.log
      - name: Preserve isolated logs and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Worlds-experimental-fixture-bundle-results
          path: logs
          if-no-files-found: warn
