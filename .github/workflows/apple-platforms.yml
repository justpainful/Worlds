    name: Experimental account compilation
    runs-on: macos-26
    needs: [ruststore-xcframework]
    timeout-minutes: 20
    env:
      WORLDS_REQUIRE_NATIVE_WRITES: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: Worlds-shared-ruststore-xcframework
          path: ruststore-artifact
      - name: Verify and restore RustStore
        shell: bash
        run: |
          set -euo pipefail
          test "$(cat ruststore-artifact/source-revision)" = "$GITHUB_SHA"
          (cd ruststore-artifact && shasum -a 256 -c SHA256SUMS)
          mkdir -p logs Apple/WorldsCore/Artifacts
          tar -xzf ruststore-artifact/ruststore-xcframework.tar.gz -C Apple/WorldsCore/Artifacts
          test -d Apple/WorldsCore/Artifacts/WorldsRustStore.xcframework
      - name: Generate application project
        run: |
          sudo xcode-select --switch /Applications/Xcode_26.6.app/Contents/Developer
          brew install xcodegen
          xcodegen generate --spec Apple/project.yml
      - name: Compile experimental account on macOS and iOS Simulator
        shell: bash
        run: |
          set -o pipefail
          result=0
          for platform in macOS iOS; do
            if [[ "$platform" == macOS ]]; then destination='generic/platform=macOS'; else destination='generic/platform=iOS Simulator'; fi
            if ! xcodebuild -project Apple/Worlds.xcodeproj -scheme "Worlds-$platform" \
              -configuration Debug -destination "$destination" \
              'SWIFT_ACTIVE_COMPILATION_CONDITIONS=$(inherited) DEBUG WORLDS_EXPERIMENTAL_LOCAL_COPY WORLDS_EXPERIMENTAL_ACCOUNT' \
              CODE_SIGNING_ALLOWED=NO build 2>&1 | tee "logs/account-$platform-build.log"; then result=1; fi
          done
          test "$result" = 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Worlds-experimental-account-build-logs
          path: logs/
          if-no-files-found: warn

