name: Apple platforms

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: apple-platforms-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core-tests:
    name: Swift core tests
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Select and inspect Xcode
        run: |
          sudo xcode-select --switch /Applications/Xcode_26.6.app/Contents/Developer
          xcodebuild -version
          swift --version
      - name: Run Swift package tests
        shell: bash
        run: |
          set -o pipefail
          mkdir -p logs
          swift test --package-path Apple/WorldsCore 2>&1 | tee logs/swift-test.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: WorldsCore-test-log
          path: logs/
          if-no-files-found: warn

  ios:
    name: Worlds-${{ matrix.device }} build check
    runs-on: macos-26
    strategy:
      fail-fast: false
      matrix:
        include:
          - device: iPhone
            family: 1
          - device: iPad
            family: 2
    steps:
      - uses: actions/checkout@v4
      - name: Select and inspect Xcode
        run: |
          sudo xcode-select --switch /Applications/Xcode_26.6.app/Contents/Developer
          xcodebuild -version
          xcodebuild -showsdks
      - name: Install project generator
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate --spec Apple/project.yml
      - name: Build simulator
        shell: bash
        run: |
          set -o pipefail
          mkdir -p logs
          xcodebuild -project Apple/Worlds.xcodeproj -scheme Worlds-iOS \
            -configuration Release -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/WorldsSimulator" \
            TARGETED_DEVICE_FAMILY=${{ matrix.family }} CODE_SIGNING_ALLOWED=NO build \
            2>&1 | tee logs/${{ matrix.device }}-simulator.log
          test ! -e "$RUNNER_TEMP/WorldsSimulator/Build/Products/Release-iphonesimulator/Worlds.app/worlds-v1-fixture.db"
      - name: Build unsigned device target
        shell: bash
        run: |
          set -o pipefail
          xcodebuild -project Apple/Worlds.xcodeproj -scheme Worlds-iOS \
            -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/WorldsDevice" \
            TARGETED_DEVICE_FAMILY=${{ matrix.family }} CODE_SIGNING_ALLOWED=NO build \
            2>&1 | tee logs/${{ matrix.device }}-device.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Worlds-${{ matrix.device }}-build-logs
          path: logs/
          if-no-files-found: warn

  macos:
    name: Worlds-macOS build check
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Select and inspect Xcode
        run: |
          sudo xcode-select --switch /Applications/Xcode_26.6.app/Contents/Developer
          xcodebuild -version
          xcodebuild -showsdks
      - name: Install project generator
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate --spec Apple/project.yml
      - name: Build unsigned application target
        shell: bash
        run: |
          set -o pipefail
          mkdir -p logs
          xcodebuild -project Apple/Worlds.xcodeproj -scheme Worlds-macOS \
            -configuration Release -destination 'generic/platform=macOS' \
            -derivedDataPath "$RUNNER_TEMP/WorldsMac" CODE_SIGNING_ALLOWED=NO build \
            2>&1 | tee logs/macos.log
          test ! -e "$RUNNER_TEMP/WorldsMac/Build/Products/Release/Worlds.app/Contents/Resources/worlds-v1-fixture.db"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Worlds-macOS-build-logs
          path: logs/
          if-no-files-found: warn

  native-writes:
    name: Rust bridge and native write tests
    runs-on: macos-26
    timeout-minutes: 45
    env:
      WORLDS_REQUIRE_NATIVE_WRITES: "1"
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: |
          sudo xcode-select --switch /Applications/Xcode_26.6.app/Contents/Developer
          xcodebuild -version
      - uses: dtolnay/rust-toolchain@stable
      - name: Build required XCFramework
        shell: bash
        run: |
          set -o pipefail
          mkdir -p logs
          bash Apple/RustStore/scripts/build-apple.sh 2>&1 | tee logs/rust-xcframework.log
          test -d Apple/WorldsCore/Artifacts/WorldsRustStore.xcframework
      - name: Discover required write tests
        shell: bash
        run: |
          set -o pipefail
          swift test --package-path Apple/WorldsCore list 2>&1 | tee logs/write-tests-discovery.log
          grep -q 'NativePersonalStoreTests' logs/write-tests-discovery.log
          grep -q 'testSQLiteLinkageAndFTSAvailability' logs/write-tests-discovery.log
      - name: Test write bridge on macOS
        shell: bash
        run: |
          set -o pipefail
          swift test --package-path Apple/WorldsCore --filter NativePersonalStoreTests 2>&1 | tee logs/write-tests-macos.log
          grep -q 'testSQLiteLinkageAndFTSAvailability' logs/write-tests-macos.log
      - name: Test write bridge on iOS simulator
        shell: bash
        run: |
          set -o pipefail
          cd Apple/WorldsCore
          xcodebuild -scheme WorldsCore-Package \
            -destination 'platform=iOS Simulator,name=iPhone 17,OS=26.5' \
            -only-testing:WorldsNativeWritesTests/NativePersonalStoreTests \
            -resultBundlePath "$GITHUB_WORKSPACE/write-simulator.xcresult" \
            CODE_SIGNING_ALLOWED=NO test 2>&1 | tee "$GITHUB_WORKSPACE/logs/write-tests-ios.log"
          grep -q 'testSQLiteLinkageAndFTSAvailability' "$GITHUB_WORKSPACE/logs/write-tests-ios.log"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Worlds-native-write-test-results
          path: |
            logs/
            write-simulator.xcresult/
          if-no-files-found: warn

  collaboration-bridge:
    name: Rust collaboration bridge tests
    runs-on: macos-26
    timeout-minutes: 45
    env:
      WORLDS_REQUIRE_COLLABORATION: "1"
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: |
          sudo xcode-select --switch /Applications/Xcode_26.6.app/Contents/Developer
          xcodebuild -version
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim,x86_64-apple-ios,aarch64-apple-darwin,x86_64-apple-darwin
      - name: Build required collaboration XCFramework
        shell: bash
        run: |
          set -o pipefail
          mkdir -p logs
          bash Apple/RustCollaboration/scripts/build-apple.sh 2>&1 | tee logs/collaboration-build.log
          test -d Apple/WorldsCore/Artifacts/WorldsRustCollaboration.xcframework
      - name: Discover collaboration tests
        shell: bash
        run: |
          set -o pipefail
          swift test --package-path Apple/WorldsCore list 2>&1 | tee logs/collaboration-discovery.log
          grep -q 'testNativeFixtureStateVectorAndIncrement' logs/collaboration-discovery.log
          grep -q 'testMalformedUpdatesFailWithoutFreeingTheDocument' logs/collaboration-discovery.log
          grep -q 'testSessionAcknowledgesHandshakeWatermark' logs/collaboration-discovery.log
          grep -q 'testSQLiteStoreOnWorldsV11Fixture' logs/collaboration-discovery.log
      - name: Test collaboration bridge on macOS
        shell: bash
        run: |
          set -o pipefail
          swift test --package-path Apple/WorldsCore --filter WorldsCollaborationTests 2>&1 | tee logs/collaboration-macos.log
          grep -q 'testNativeFixtureStateVectorAndIncrement' logs/collaboration-macos.log
          grep -q 'testMalformedUpdatesFailWithoutFreeingTheDocument' logs/collaboration-macos.log
          grep -q 'testSessionAcknowledgesHandshakeWatermark' logs/collaboration-macos.log
          grep -q 'testSQLiteStoreOnWorldsV11Fixture' logs/collaboration-macos.log
      - name: Test collaboration bridge on iOS simulator
        shell: bash
        run: |
          set -o pipefail
          cd Apple/WorldsCore
          xcodebuild -scheme WorldsCore-Package \
            -destination 'platform=iOS Simulator,name=iPhone 17,OS=26.5' \
            -only-testing:WorldsCollaborationTests \
            -resultBundlePath "$GITHUB_WORKSPACE/collaboration-simulator.xcresult" \
            CODE_SIGNING_ALLOWED=NO test 2>&1 | tee "$GITHUB_WORKSPACE/logs/collaboration-ios.log"
          grep -q 'testNativeFixtureStateVectorAndIncrement' "$GITHUB_WORKSPACE/logs/collaboration-ios.log"
          grep -q 'testMalformedUpdatesFailWithoutFreeingTheDocument' "$GITHUB_WORKSPACE/logs/collaboration-ios.log"
          grep -q 'testSessionAcknowledgesHandshakeWatermark' "$GITHUB_WORKSPACE/logs/collaboration-ios.log"
          grep -q 'testSQLiteStoreOnWorldsV11Fixture' "$GITHUB_WORKSPACE/logs/collaboration-ios.log"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Worlds-collaboration-test-results
          path: |
            logs/
            collaboration-simulator.xcresult/
          if-no-files-found: warn

  collaboration-local-worker:
    name: Rust collaboration with isolated local sync Worker
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: services/sync/pnpm-lock.yaml
      - uses: dtolnay/rust-toolchain@stable
      - name: Install isolated Worker dependencies
        working-directory: services/sync
        run: pnpm install --frozen-lockfile
      - name: Run isolated local service integration
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p logs
          cd services/sync
          pnpm exec wrangler dev -c dev/identity.toml --port 18791 --ip 127.0.0.1 --persist-to "$RUNNER_TEMP/identity" > "$GITHUB_WORKSPACE/logs/local-identity.log" 2>&1 &
          identity_pid=$!
          pnpm exec wrangler dev --env local --port 18790 --ip 127.0.0.1 --persist-to "$RUNNER_TEMP/sync" --var JWKS_URL:http://127.0.0.1:18791/.well-known/jwks.json > "$GITHUB_WORKSPACE/logs/local-sync.log" 2>&1 &
          sync_pid=$!
          trap 'kill "$identity_pid" "$sync_pid" 2>/dev/null || true' EXIT
          ready=0
          for attempt in $(seq 1 90); do
            if curl -fsS http://127.0.0.1:18791/.well-known/jwks.json >/dev/null 2>&1; then ready=1; break; fi
            sleep 1
          done
          test "$ready" = 1
          editor_token=$(curl -fsS 'http://127.0.0.1:18791/dev/token?sub=editor' | jq -er .token)
          viewer_token=$(curl -fsS 'http://127.0.0.1:18791/dev/token?sub=viewer' | jq -er .token)
          curl -fsS -X POST http://127.0.0.1:18791/dev/grant -H 'Content-Type: application/json' \
            --data '{"userId":"viewer","workspaceId":"fixture-workspace","docId":null,"level":"view"}' >/dev/null
          ready=0
          for attempt in $(seq 1 90); do
            if curl -fsS -H "Authorization: Bearer $editor_token" http://127.0.0.1:18790/v1/workspaces/fixture-workspace/docs/probe/versions >/dev/null 2>&1; then ready=1; break; fi
            sleep 1
          done
          test "$ready" = 1
          cd "$GITHUB_WORKSPACE"
          WORLDS_LIVE_SYNC_URL=ws://127.0.0.1:18790 \
          WORLDS_LIVE_EDITOR_TOKEN="$editor_token" WORLDS_LIVE_VIEWER_TOKEN="$viewer_token" \
            cargo test --locked --manifest-path Apple/RustCollaboration/Cargo.toml --test live_service -- --ignored --nocapture \
            2>&1 | tee logs/collaboration-local-worker.log
          grep -q 'live_native_replica_offline_merge_reconnect_and_refusal ... ok' logs/collaboration-local-worker.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Worlds-local-collaboration-worker-logs
          path: logs/
          if-no-files-found: warn

  ui-tests:
    name: UI tests ${{ matrix.device }}
    runs-on: macos-26
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - device: iPhone
            scheme: Worlds-iOS
            destination: 'platform=iOS Simulator,name=iPhone 17,OS=26.5'
          - device: iPad
            scheme: Worlds-iOS
            destination: 'platform=iOS Simulator,name=iPad (A16),OS=26.5'
          - device: macOS
            scheme: Worlds-macOS
            destination: 'platform=macOS'
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: |
          sudo xcode-select --switch /Applications/Xcode_26.6.app/Contents/Developer
          xcodebuild -version
          xcrun simctl list devices available
      - name: Install project generator and timeout utility
        run: |
          brew install xcodegen
          command -v gtimeout >/dev/null || brew install coreutils
      - name: Generate project
        run: xcodegen generate --spec Apple/project.yml
      - name: Run UI automation and retain results
        shell: bash
        run: |
          set -o pipefail
          mkdir -p logs results
          gtimeout --kill-after=30s 15m xcodebuild -project Apple/Worlds.xcodeproj -scheme '${{ matrix.scheme }}' \
            -configuration Debug -destination '${{ matrix.destination }}' \
            -derivedDataPath "$RUNNER_TEMP/WorldsUI" \
            -resultBundlePath "$GITHUB_WORKSPACE/results/${{ matrix.device }}.xcresult" \
            CODE_SIGNING_ALLOWED=NO test 2>&1 | tee logs/ui-${{ matrix.device }}.log
      - name: Export screenshot attachments
        if: always()
        shell: bash
        run: |
          result="results/${{ matrix.device }}.xcresult"
          if [ -d "$result" ]; then
            mkdir -p screenshots
            xcrun xcresulttool export attachments --path "$result" --output-path screenshots
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Worlds-${{ matrix.device }}-UI-results
          path: |
            results/
            screenshots/
            logs/
            Apple/App/UI_TEST_COVERAGE.md
          if-no-files-found: warn
