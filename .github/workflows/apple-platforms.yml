name: Apple platforms

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: apple-platforms-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core-tests:
    name: Swift core tests
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Select and inspect Xcode
        run: |
          sudo xcode-select --switch /Applications/Xcode_26.6.app/Contents/Developer
          xcodebuild -version
          swift --version
      - name: Run Swift package tests
        shell: bash
        run: |
          set -o pipefail
          mkdir -p logs
          swift test --package-path Apple/WorldsCore --skip WorldsDrawingVisualComparisonTests 2>&1 | tee logs/swift-test.log
          grep -q 'testSaveWaitsForNativeTextComposition' logs/swift-test.log
          grep -E 'testRecognitionMatchesModifiedSourceCorpus.*passed' logs/swift-test.log
          grep -E 'testMarkersTrackEveryTaskAndNumberedStart.*passed' logs/swift-test.log
          grep -E 'testNestedAndEmptyTaskMarkersRemainEditableWithoutChangingText.*passed' logs/swift-test.log
          grep -E 'testAppendItemsKeepsUnknownSiblingAndSupportsUndo.*passed' logs/swift-test.log
          grep -E 'testConvertAndUnwrapListWithUndoAndProtectCheckedTasks.*passed' logs/swift-test.log
          grep -E 'testUnwrapMultipleItemsAndConvertNestedWithoutLosingUnknownBlock.*passed' logs/swift-test.log
          grep -E 'testNestedTaskEnterBackspaceRTLAndUndo.*passed' logs/swift-test.log
          grep -E 'testAppendEmptyNestedTaskThenTypeAndUndo.*passed' logs/swift-test.log
          grep -E 'testListKeyboardBoundariesUseExactRangeWithRepeatedItems.*passed' logs/swift-test.log
          grep -E 'testEnterOnEmptyNestedTaskLiftsAndUndoRestores.*passed' logs/swift-test.log
          grep -E 'testIndentAndOutdentPreserveArabicUTF16Caret.*passed' logs/swift-test.log
          grep -E 'testDocumentAlignmentPreservesRTLAndUnknownAttributesWithUndo.*passed' logs/swift-test.log
          grep -E 'testDocumentParagraphStylesPreserveRTLAndUndo.*passed' logs/swift-test.log
          grep -E 'testAppendTableRowPreservesExistingDataAndUndo.*passed' logs/swift-test.log
          grep -E 'testAppendTableColumnPreservesHeadersCellsAndRejectsMerged.*passed' logs/swift-test.log
          grep -E 'testInsertRowBelowSelectionPreservesHeaderAndRejectsOpaqueShift.*passed' logs/swift-test.log
          grep -E 'testDeleteLastTableRowRejectsOpaqueDataAndSupportsUndo.*passed' logs/swift-test.log
          grep -E 'testDeleteLastTableColumnPreservesCaretAndRejectsOpaqueCell.*passed' logs/swift-test.log
          grep -E 'testDeleteTableRowRejectsWhenRemainingTableHasNoTextCaret.*passed' logs/swift-test.log
          grep -E 'testInsertColumnAfterSelectionPreservesTypesAndRejectsOpaqueShift.*passed' logs/swift-test.log
          grep -E 'testInsertColumnAfterHeaderUsesFollowingColumnTypes.*passed' logs/swift-test.log
          grep -E 'testInsertRowRejectsLaterOpaqueRowWithoutMutation.*passed' logs/swift-test.log
          grep -E 'testInsertRowBelowMixedHeaderUsesSelectedCellTypes.*passed' logs/swift-test.log
          grep -E 'testAppendColumnRejectsLaterInvalidRowAtomically.*passed' logs/swift-test.log
          grep -E 'testAppendColumnUsesLastCellTypeInMixedRows.*passed' logs/swift-test.log
          grep -E 'testIndentAndOutdentLastTaskWithUndoAndOpaqueRejection.*passed' logs/swift-test.log
          grep -E 'testEnterExitsLastEmptyRootTaskAndNewParagraphAcceptsRTLText.*passed' logs/swift-test.log
          grep -E 'testOutdentRejectsNestedMetadataAndKeepsDocument.*passed' logs/swift-test.log
          grep -E 'testStrikethroughPreservesArabicTextAndUndo.*passed' logs/swift-test.log
          grep -E 'testHeadingConversionPreservesOpaqueDataAndRejectsAmbiguousLevel.*passed' logs/swift-test.log
          grep -E 'testLinkAcrossRTLTextRunsAndUnsafeRejection.*passed' logs/swift-test.log
          grep -E 'testUnsafeExistingLinkAndOpaqueSiblingRemainUnchanged.*passed' logs/swift-test.log
          grep -E 'testListEnterRejectsUnknownSiblingAndBackspaceRejectsDifferentTaskState.*passed' logs/swift-test.log
          grep -E 'testEditingOrderUndoAndUnknownFields.*passed' logs/swift-test.log
          grep -E 'testDuplicateRekeysElementsAndKeepsMediaButRejectsUnknownFields.*passed' logs/swift-test.log
          grep -E 'testBlankDuplicateReorderAndUndo.*passed' logs/swift-test.log
          grep -E 'testRejectsInvalidAndPreservesSession.*passed' logs/swift-test.log
          grep -E 'testCreateListsAndToggleTaskWithUndoRedo.*passed' logs/swift-test.log
          grep -E 'testListCreationRejectsUnknownContent.*passed' logs/swift-test.log
          grep -E 'testPartialArabicFormattingRoundTripsAndUndoPreservesOpaqueBlocks.*passed' logs/swift-test.log
          grep -E 'testPartialFormattingRejectsUnknownMarksAndSurrogateSplit.*passed' logs/swift-test.log
          grep -E 'testPartialFormattingInsideRTLListPreservesListStructure.*passed' logs/swift-test.log
          grep -E 'testExperimentalStrokeSceneRejectsUnsupportedElements.*passed' logs/swift-test.log
          grep -E 'testAcceptedPrecedesStreamAndSavedMessagesReload.*passed' logs/swift-test.log
          grep -E 'testUnexpectedToolIsRejectedWithoutMCP.*passed' logs/swift-test.log
          grep -E 'testCancelAfterAcceptanceStopsRun.*passed' logs/swift-test.log
          grep -E 'testFailedFinalSaveRemainsRecoverable.*passed' logs/swift-test.log
          grep -E 'testFailedSaveStagesResponseInIsolatedJournal.*passed' logs/swift-test.log
          grep -E 'testConcurrentStoresCannotShareIsolatedJournal.*passed' logs/swift-test.log
          grep -E 'testFailedForwardDoesNotLoseFailedSaveRecovery.*passed' logs/swift-test.log
          grep -E 'testRejectedNativeTextIsRetainedAndBlocksSaveUntilDiscarded.*passed' logs/swift-test.log
          grep -E 'testKnownRichClipboardFormatsAreRejectedInsteadOfFlattened.*passed' logs/swift-test.log
          grep -q 'testStagesAndCleansUpAnIsolatedFile' logs/swift-test.log
          grep -q 'testBoundsAndSymlink' logs/swift-test.log
          grep -q 'testOriginalNameCleaning' logs/swift-test.log
          grep -E 'testOwnedPersonalFileCanBeReadAndMismatchedOwnerIsRejected.*passed' logs/swift-test.log
          grep -E 'testDuplicateLinksCannotBeUnlinkedOrModifiedSilently.*passed' logs/swift-test.log
          grep -E 'testRejectsHardLinkedAttachment.*passed' logs/swift-test.log
          grep -E 'testOpenedAttachmentUsesOriginalDescriptorAfterPathReplacement.*passed' logs/swift-test.log
          grep -E 'testChangedOpenAttachmentIsRejectedBeforeReadAndPlaybackCopy.*passed' logs/swift-test.log
          grep -E 'testHardLinkAddedAfterOpenIsRejected.*passed' logs/swift-test.log
          grep -E 'testOpenedVideoReportsPlaybackFailureAndIgnoresFailureAfterClose.*passed' logs/swift-test.log
          grep -E 'testResolutionBudgetPreservesSmallOriginalAndCapsLargeImage.*passed' logs/swift-test.log
          grep -E 'testImageReadsVerifiedDescriptorAfterPathReplacement.*passed' logs/swift-test.log
          grep -E 'testPDFAndChangedSizeFailClosed.*passed' logs/swift-test.log
          grep -E 'testLargeImageIsReportedAsDownsampled.*passed' logs/swift-test.log
          grep -E 'testPasswordProtectedPDFReportsLimit.*passed' logs/swift-test.log
          grep -E 'testTruncatedOpenFileIsRejected.*passed' logs/swift-test.log
          grep -E 'testCloseBeforeLoadDoesNotDecode.*passed' logs/swift-test.log
          grep -E 'testOriginalDefaultChainAndArabicLabels.*passed' logs/swift-test.log
          grep -E 'testKnownUnsupportedSyntaxFailsClosed.*passed' logs/swift-test.log
          grep -E 'testElementLimitFailsWithoutPartialResult.*passed' logs/swift-test.log
          grep -E 'testSourceEditPreservesUnknownFieldsExactly.*passed' logs/swift-test.log
          grep -E 'testDecisionIsSingleUseAndDismissalCannotOverrideApproval.*passed' logs/swift-test.log
          grep -E 'testDismissalDeclinesOnlyOnce.*passed' logs/swift-test.log
          grep -E 'testReviewEscapesDirectionalAndLineControls.*passed' logs/swift-test.log
          grep -E 'testWorkspaceAccessUsesCurrentAccountAndFailsClosed.*passed' logs/swift-test.log
          grep -E 'testTokenProviderRejectsOtherAccount.*passed' logs/swift-test.log
          grep -E 'testAccountBoundTokenJoinsActiveRefreshWithoutReusingToken.*passed' logs/swift-test.log
          grep -E 'testWorkspaceAccessRejectsDuplicatePageEntries.*passed' logs/swift-test.log
          grep -E 'testWorkspaceAccessPreventsConcurrentAccountChange.*passed' logs/swift-test.log
          grep -q 'testActualYjsFixture' logs/swift-test.log
          grep -E 'testYjsRelativeCursorAwarenessRemainsOpaque.*passed' logs/swift-test.log
          grep -E 'testCancelledPasskeyBeforePresentationDoesNotStart.*passed' logs/swift-test.log
          grep -E 'testOfflineSignOutDeletesLocalSession.*passed' logs/swift-test.log
          grep -E 'testAccountSnapshotUsesAuthenticatedServiceResponses.*passed' logs/swift-test.log
          grep -E 'testAccountSnapshotRejectsDifferentUser.*passed' logs/swift-test.log
          grep -E 'testStoredSessionAvailabilityTracksLocalSignOut.*passed' logs/swift-test.log
          grep -E 'testSuccessfulSignInKeepsSessionWhenProfileUnavailable.*passed' logs/swift-test.log
          grep -E 'testCancelledRequestDoesNotCreateChallenge.*passed' logs/swift-test.log
          grep -E 'testKeychainDeletionFailureDoesNotClaimSignOut.*passed' logs/swift-test.log
          grep -E 'testExplicitAddressOverridesBuildDefault.*passed' logs/swift-test.log
          grep -E 'testMissingAndUnsafeAddressesAreRejected.*passed' logs/swift-test.log
          grep -E 'testExpiredSessionAfterVerificationIsNotShownAsSignedIn.*passed' logs/swift-test.log
          grep -E 'testUncertainVerificationRequiresNewCode.*passed' logs/swift-test.log
          grep -E 'testSignOutCannotRaceStoredSessionCheck.*passed' logs/swift-test.log
          grep -E 'testSignOutInvalidatesOutstandingPasskeyChallenge.*passed' logs/swift-test.log
          grep -E 'testSignOutRejectsPasskeyChallengeStillInFlight.*passed' logs/swift-test.log
          grep -E 'testSignOutRejectsEmailChallengeStillInFlight.*passed' logs/swift-test.log
          grep -E 'testPasskeyManagementUsesAuthenticatedEndpointsAndRejectsUnsafeID.*passed' logs/swift-test.log
          grep -E 'testConcurrentRefreshUsesOneRotation.*passed' logs/swift-test.log
          grep -E 'testSignOutWaitsForActiveRefresh.*passed' logs/swift-test.log
          grep -E 'testRecreatedClientRefreshesUsingSavedDeviceKey.*passed' logs/swift-test.log
          grep -E 'testInterruptedRotationIsNotReplayedAfterClientRecreation.*passed' logs/swift-test.log
          grep -E 'testFailedRotationSaveDoesNotReplayPreviousToken.*passed' logs/swift-test.log
          grep -E 'testConcurrentRefreshRequestsShareOneRotation.*passed' logs/swift-test.log
          grep -E 'testRejectsAmbiguousAuthenticatedPaths.*passed' logs/swift-test.log
          grep -q 'testReadOpaqueRoundTripAndRejectShared' logs/swift-test.log
          grep -E 'testLegacyAndMalformedSyncMetadataAreFilteredConsistently.*passed' logs/swift-test.log
          grep -E 'testInlineImageRequiresPersonalPageOwnershipAndUnambiguousReference.*passed' logs/swift-test.log
          grep -E 'testSnapshotRetainsArchivedState.*passed' logs/swift-test.log
          grep -E 'testAmbiguousSyncMetadataCannotLeakFTSOrParentTitle.*passed' logs/swift-test.log
          grep -E 'testUnexpectedToolIsRecordedAsErrorWithoutPermission.*passed' logs/swift-test.log
          grep -E 'testAnotherStoreCannotAccessExistingConversation.*passed' logs/swift-test.log
          grep -E 'testSessionReplacementCannotResumeReadOrComplete.*passed' logs/swift-test.log
          grep -E 'testRecreatedStoreRefusesUnprovenConversationOwnership.*passed' logs/swift-test.log
          grep -E 'testUnmatchedRunCannotFinishOrReleaseReservation.*passed' logs/swift-test.log
          grep -E 'testEventLimitsFailAndPreserveBoundedOutput.*passed' logs/swift-test.log
          grep -E 'testFailedAssistantSaveRollsBackAndCanRetry.*passed' logs/swift-test.log
          grep -E 'testStreamingAndCancellation.*passed' logs/swift-test.log
          grep -E 'testLoadFailurePreventsSendingAndKeepsDraft.*passed' logs/swift-test.log
          grep -q 'testOriginalDabGeometryAndSeededSpray' logs/swift-test.log
          grep -q 'testRejectsUnboundedWork' logs/swift-test.log
          grep -q 'testExchangeClocksAndLeave' logs/swift-test.log
          grep -q 'testExpiryHeartbeatAndLocalReassertion' logs/swift-test.log
          grep -q 'testMalformedJSONDoesNotApplyPartialUpdate' logs/swift-test.log
          grep -q 'testRejectsRemoteClientIDCollisionWithoutOverwritingLocalState' logs/swift-test.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: WorldsCore-test-log
          path: logs/
          if-no-files-found: warn

  drawing-visual-comparison:
    name: Drawing visual comparison (experimental)
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select --switch /Applications/Xcode_26.6.app/Contents/Developer
      - name: Compare Canvas references on macOS
        shell: bash
        run: |
          set -o pipefail
          mkdir -p "$GITHUB_WORKSPACE/logs"
          cd Apple/WorldsCore
          xcodebuild -scheme WorldsCore-Package \
            -destination 'platform=macOS' \
            -only-testing:WorldsDrawingVisualComparisonTests \
            -resultBundlePath "$GITHUB_WORKSPACE/drawing-visual-comparison.xcresult" \
            CODE_SIGNING_ALLOWED=NO test 2>&1 | tee "$GITHUB_WORKSPACE/logs/drawing-visual-comparison.log"
          grep -E 'Test Case .*testSourceCanvasAndNativeStrokePixels.*passed' "$GITHUB_WORKSPACE/logs/drawing-visual-comparison.log"
          grep -E 'Test Case .*testPressureSensitiveHighlighterRemainsUnsupported.*passed' "$GITHUB_WORKSPACE/logs/drawing-visual-comparison.log"
          grep -E 'Test Case .*testPersistedStrokeOperationAgainstSourceCanvas.*passed' "$GITHUB_WORKSPACE/logs/drawing-visual-comparison.log"
          grep -E 'Test Case .*testCorrectedRightTriangleAgainstSourceCanvas.*passed' "$GITHUB_WORKSPACE/logs/drawing-visual-comparison.log"
          grep -E 'Test Case .*testRotatedTriangleAndStrokeAgainstSourceCanvas.*passed' "$GITHUB_WORKSPACE/logs/drawing-visual-comparison.log"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Worlds-drawing-visual-comparison
          path: |
            logs/
            drawing-visual-comparison.xcresult/
          if-no-files-found: warn

  project-editor-harness:
    name: Isolated project editor UI harness (${{ matrix.group }})
    needs: [ruststore-xcframework]
    runs-on: macos-26
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        group: [macOS, mobile]
    env:
      WORLDS_REQUIRE_NATIVE_WRITES: "1"
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select --switch /Applications/Xcode_26.6.app/Contents/Developer
      - uses: actions/download-artifact@v4
        with:
          name: Worlds-shared-ruststore-xcframework
          path: ruststore-artifact
      - name: Verify and restore RustStore
        shell: bash
        run: |
          set -euo pipefail
          test "$(cat ruststore-artifact/source-revision)" = "$GITHUB_SHA"
          (cd ruststore-artifact && shasum -a 256 -c SHA256SUMS)
          mkdir -p logs Apple/WorldsCore/Artifacts
          tar -xzf ruststore-artifact/ruststore-xcframework.tar.gz -C Apple/WorldsCore/Artifacts
          test -d Apple/WorldsCore/Artifacts/WorldsRustStore.xcframework
      - name: Generate isolated projects
        run: |
          brew install xcodegen coreutils
          xcodegen generate --spec Apple/ProjectEditorHarness/project.yml
          xcodegen generate --spec Apple/ProjectEditorHarness/local-copy-experimental.yml
      - name: Exercise isolated editor
        shell: bash
        run: |
          set -o pipefail
          result=0
          run_case() {
            local case_name="$1" project="$2" scheme="$3" destination="$4" kind="$5"
            if gtimeout --kill-after=30s 600s xcodebuild -project "Apple/ProjectEditorHarness/$project.xcodeproj" \
              -scheme "$scheme" -destination "$destination" \
              -resultBundlePath "$GITHUB_WORKSPACE/$case_name.xcresult" \
              CODE_SIGNING_ALLOWED=NO test 2>&1 | tee "logs/$case_name.log"; then
              if [[ "$kind" == harness ]]; then
                grep -E 'testEditSaveAndReopenIsolatedProject.*passed' "logs/$case_name.log" || result=1
              else
                grep -E 'testPersonalProjectEditAndReopenInLocalCopy.*passed' "logs/$case_name.log" || result=1
                if [[ "$kind" == local-ios ]]; then
                  grep -E 'testLargeTextRTLKeyboardAndSaveRemainReachable.*passed' "logs/$case_name.log" || result=1
                fi
              fi
            else
              result=1
            fi
          }
          if [[ "${{ matrix.group }}" == macOS ]]; then
            run_case harness-macOS WorldsProjectEditorHarness ProjectEditorHarness-macOS 'platform=macOS' harness
            run_case local-copy-macOS WorldsLocalCopyExperimental LocalCopy-macOS 'platform=macOS' local-mac
          else
            run_case harness-iPhone WorldsProjectEditorHarness ProjectEditorHarness-iOS 'platform=iOS Simulator,name=iPhone 17,OS=26.5' harness
            run_case local-copy-iPhone WorldsLocalCopyExperimental LocalCopy-iOS 'platform=iOS Simulator,name=iPhone 17,OS=26.5' local-ios
            run_case local-copy-iPad WorldsLocalCopyExperimental LocalCopy-iOS 'platform=iOS Simulator,name=iPad (A16),OS=26.5' local-ios
          fi
          test "$result" = 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Worlds-project-editor-${{ matrix.group }}-results
          path: |
            logs/
            harness-*.xcresult/
            local-copy-*.xcresult/
          if-no-files-found: warn

  experimental-project-links-ui:
    name: Experimental project links UI
    runs-on: macos-26
    needs: [ruststore-xcframework]
    timeout-minutes: 65
    env:
      WORLDS_REQUIRE_NATIVE_WRITES: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: Worlds-shared-ruststore-xcframework
          path: ruststore-artifact
      - name: Verify and restore RustStore
        shell: bash
        run: |
          set -euo pipefail
          test "$(cat ruststore-artifact/source-revision)" = "$GITHUB_SHA"
          (cd ruststore-artifact && shasum -a 256 -c SHA256SUMS)
          mkdir -p logs Apple/WorldsCore/Artifacts
          tar -xzf ruststore-artifact/ruststore-xcframework.tar.gz -C Apple/WorldsCore/Artifacts
          test -d Apple/WorldsCore/Artifacts/WorldsRustStore.xcframework
      - name: Generate experimental project
        run: |
          sudo xcode-select --switch /Applications/Xcode_26.6.app/Contents/Developer
          brew install xcodegen coreutils
          xcodegen generate --spec Apple/ProjectEditorHarness/project-links-experimental.yml
      - name: Test isolated links on macOS and iPhone
        shell: bash
        run: |
          set -o pipefail
          result=0
          run_links() {
            local platform="$1" case_name="$2" destination="$3"; shift 3
            local selectors=() test
            for test in "$@"; do selectors+=("-only-testing:LocalCopy-$platform-UITests/WorldsLocalCopyUITests/$test"); done
            local limit=600s
            if [ "$platform" = iOS ]; then limit=900s; fi
            if gtimeout --kill-after=30s "$limit" xcodebuild -project Apple/ProjectEditorHarness/WorldsProjectLinksExperimental.xcodeproj \
              -scheme "LocalCopy-$platform" -destination "$destination" "${selectors[@]}" \
              -resultBundlePath "$GITHUB_WORKSPACE/project-links-$case_name.xcresult" \
              CODE_SIGNING_ALLOWED=NO test 2>&1 | tee "logs/project-links-$case_name.log"; then
              for test in "$@"; do grep -E "Test Case .*${test}.*passed" "logs/project-links-$case_name.log" || result=1; done
            else
              result=1
            fi
          }
          run_links macOS macOS-standard 'platform=macOS' testPersonalProjectLinksPersistAndUnlink testDuplicateLinksAreNotRemovedSilently
          run_links macOS macOS-unavailable 'platform=macOS' testUnavailableLinkExplainsAndReloadsWithoutDiscard
          run_links iOS iPhone 'platform=iOS Simulator,name=iPhone 17,OS=26.5' testPersonalProjectLinksPersistAndUnlink testDuplicateLinksAreNotRemovedSilently testUnavailableLinkExplainsAndReloadsWithoutDiscard
          run_links iOS iPad 'platform=iOS Simulator,name=iPad (A16),OS=26.5' testPersonalProjectLinksPersistAndUnlink testDuplicateLinksAreNotRemovedSilently testUnavailableLinkExplainsAndReloadsWithoutDiscard
          test "$result" = 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Worlds-experimental-project-links-results
          path: |
            logs/
            project-links-*.xcresult/
          if-no-files-found: warn

  combined-ffi:
    name: Combined native FFI linkage
    runs-on: macos-26
    needs: [ruststore-xcframework, collaboration-xcframework]
    timeout-minutes: 20
    env:
      WORLDS_REQUIRE_NATIVE_WRITES: "1"
      WORLDS_REQUIRE_COLLABORATION: "1"
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select --switch /Applications/Xcode_26.6.app/Contents/Developer
      - uses: actions/download-artifact@v4
        with:
          name: Worlds-shared-ruststore-xcframework
          path: ruststore-artifact
      - uses: actions/download-artifact@v4
        with:
          name: Worlds-shared-collaboration-xcframework
          path: shared-artifact
      - name: Verify and restore both binaries
        shell: bash
        run: |
          set -euo pipefail
          test "$(cat ruststore-artifact/source-revision)" = "$GITHUB_SHA"
          test "$(cat shared-artifact/source-revision)" = "$GITHUB_SHA"
          (cd ruststore-artifact && shasum -a 256 -c SHA256SUMS)
          (cd shared-artifact && shasum -a 256 -c SHA256SUMS)
          mkdir -p logs Apple/WorldsCore/Artifacts
          tar -xzf ruststore-artifact/ruststore-xcframework.tar.gz -C Apple/WorldsCore/Artifacts
          tar -xzf shared-artifact/collaboration-xcframework.tar.gz -C Apple/WorldsCore/Artifacts
          test -d Apple/WorldsCore/Artifacts/WorldsRustStore.xcframework
          test -d Apple/WorldsCore/Artifacts/WorldsRustCollaboration.xcframework
      - name: Discover and exercise both FFI libraries
        shell: bash
        run: |
          set -o pipefail
          swift test --package-path Apple/WorldsCore list 2>&1 | tee logs/combined-discovery.log
          grep -q 'testBothLibrariesAllocateAndFreeTheirOwnObjects' logs/combined-discovery.log
          swift test --package-path Apple/WorldsCore --filter WorldsCombinedFFITests 2>&1 | tee logs/combined-ffi.log
          grep -E 'testBothLibrariesAllocateAndFreeTheirOwnObjects.*passed' logs/combined-ffi.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Worlds-combined-ffi-results
          path: logs/
          if-no-files-found: warn

  claude-conversation-harness-build:
    name: Experimental Claude conversation harness compilation
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Generate isolated harness
        run: |
          sudo xcode-select --switch /Applications/Xcode_26.6.app/Contents/Developer
          brew install xcodegen
          xcodegen generate --spec Apple/ClaudeConversationHarness/project.yml
      - name: Build without launching Claude
        shell: bash
        run: |
          set -o pipefail
          mkdir -p logs
          xcodebuild -project Apple/ClaudeConversationHarness/WorldsClaudeConversationHarness.xcodeproj \
            -scheme ClaudeConversationHarness-macOS -configuration Debug -destination 'generic/platform=macOS' \
            CODE_SIGNING_ALLOWED=NO build 2>&1 | tee logs/claude-harness-build.log
      - uses: dtolnay/rust-toolchain@1.99.1
      - name: Exercise isolated MCP protocol fixture
        shell: bash
        run: |
          set -euo pipefail
          cargo build --locked --manifest-path Apple/RustMCP/Cargo.toml --bin worlds_mcp_fixture 2>&1 | tee logs/mcp-fixture-build.log
          export WORLDS_REQUIRE_MCP_FIXTURE=1
          export WORLDS_MCP_FIXTURE_BIN="$GITHUB_WORKSPACE/Apple/RustMCP/target/debug/worlds_mcp_fixture"
          test -x "$WORLDS_MCP_FIXTURE_BIN"
          swift test --package-path Apple/WorldsCore --filter MCPFixtureIntegrationTests 2>&1 | tee logs/mcp-fixture-swift.log
          grep -E 'testRunnerUsesScopedOriginalProtocolFixture.*passed' logs/mcp-fixture-swift.log
      - name: Test isolated fixture conversation and process restart
        shell: bash
        run: |
          set -o pipefail
          xcodebuild -project Apple/ClaudeConversationHarness/WorldsClaudeConversationHarness.xcodeproj \
            -scheme ClaudeConversationHarness-macOS -configuration Debug -destination 'platform=macOS' \
            -resultBundlePath "$GITHUB_WORKSPACE/logs/claude-harness.xcresult" \
            CODE_SIGNING_ALLOWED=NO test 2>&1 | tee logs/claude-harness-ui.log
          grep -E 'testConversationSurvivesProcessRestartAndCancellation.*passed' logs/claude-harness-ui.log
          grep -E 'testPendingResponseRecoversAfterProcessRestart.*passed' logs/claude-harness-ui.log
      - name: Export fixture UI failure attachments
        if: always()
        shell: bash
        run: |
          if [ -f logs/claude-harness.xcresult/Info.plist ]; then
            mkdir -p logs/claude-ui-attachments
