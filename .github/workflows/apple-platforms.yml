name: Apple platforms

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: apple-platforms-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core-tests:
    name: Swift core tests
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Select and inspect Xcode
        run: |
          sudo xcode-select --switch /Applications/Xcode_26.6.app/Contents/Developer
          xcodebuild -version
          swift --version
      - name: Run Swift package tests
        shell: bash
        run: |
          set -o pipefail
          mkdir -p logs
          swift test --package-path Apple/WorldsCore --skip WorldsDrawingVisualComparisonTests 2>&1 | tee logs/swift-test.log
          grep -q 'testSaveWaitsForNativeTextComposition' logs/swift-test.log
          grep -q 'testStagesAndCleansUpAnIsolatedFile' logs/swift-test.log
          grep -q 'testBoundsAndSymlink' logs/swift-test.log
          grep -q 'testOriginalNameCleaning' logs/swift-test.log
          grep -E 'testOwnedPersonalFileCanBeReadAndMismatchedOwnerIsRejected.*passed' logs/swift-test.log
          grep -E 'testRejectsHardLinkedAttachment.*passed' logs/swift-test.log
          grep -q 'testActualYjsFixture' logs/swift-test.log
          grep -E 'testCancelledPasskeyBeforePresentationDoesNotStart.*passed' logs/swift-test.log
          grep -E 'testOfflineSignOutDeletesLocalSession.*passed' logs/swift-test.log
          grep -E 'testConcurrentRefreshUsesOneRotation.*passed' logs/swift-test.log
          grep -E 'testSignOutWaitsForActiveRefresh.*passed' logs/swift-test.log
          grep -E 'testRecreatedClientRefreshesUsingSavedDeviceKey.*passed' logs/swift-test.log
          grep -E 'testInterruptedRotationIsNotReplayedAfterClientRecreation.*passed' logs/swift-test.log
          grep -E 'testFailedRotationSaveDoesNotReplayPreviousToken.*passed' logs/swift-test.log
          grep -E 'testConcurrentRefreshRequestsShareOneRotation.*passed' logs/swift-test.log
          grep -E 'testRejectsAmbiguousAuthenticatedPaths.*passed' logs/swift-test.log
          grep -q 'testReadOpaqueRoundTripAndRejectShared' logs/swift-test.log
          grep -E 'testLegacyAndMalformedSyncMetadataAreFilteredConsistently.*passed' logs/swift-test.log
          grep -E 'testAmbiguousSyncMetadataCannotLeakFTSOrParentTitle.*passed' logs/swift-test.log
          grep -E 'testUnexpectedToolIsRecordedAsErrorWithoutPermission.*passed' logs/swift-test.log
          grep -E 'testAnotherStoreCannotAccessExistingConversation.*passed' logs/swift-test.log
          grep -E 'testUnmatchedRunCannotFinishOrReleaseReservation.*passed' logs/swift-test.log
          grep -E 'testEventLimitsFailAndPreserveBoundedOutput.*passed' logs/swift-test.log
          grep -E 'testFailedAssistantSaveRollsBackAndCanRetry.*passed' logs/swift-test.log
          grep -E 'testStreamingAndCancellation.*passed' logs/swift-test.log
          grep -E 'testLoadFailurePreventsSendingAndKeepsDraft.*passed' logs/swift-test.log
          grep -q 'testOriginalDabGeometryAndSeededSpray' logs/swift-test.log
          grep -q 'testRejectsUnboundedWork' logs/swift-test.log
          grep -q 'testExchangeClocksAndLeave' logs/swift-test.log
          grep -q 'testExpiryHeartbeatAndLocalReassertion' logs/swift-test.log
          grep -q 'testMalformedJSONDoesNotApplyPartialUpdate' logs/swift-test.log
          grep -q 'testRejectsRemoteClientIDCollisionWithoutOverwritingLocalState' logs/swift-test.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: WorldsCore-test-log
          path: logs/
          if-no-files-found: warn

  drawing-visual-comparison:
    name: Drawing visual comparison (experimental)
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select --switch /Applications/Xcode_26.6.app/Contents/Developer
      - name: Compare Canvas references on macOS
        shell: bash
        run: |
          set -o pipefail
          mkdir -p "$GITHUB_WORKSPACE/logs"
          cd Apple/WorldsCore
          xcodebuild -scheme WorldsCore-Package \
            -destination 'platform=macOS' \
            -only-testing:WorldsDrawingVisualComparisonTests \
            -resultBundlePath "$GITHUB_WORKSPACE/drawing-visual-comparison.xcresult" \
            CODE_SIGNING_ALLOWED=NO test 2>&1 | tee "$GITHUB_WORKSPACE/logs/drawing-visual-comparison.log"
          grep -E 'Test Case .*testSourceCanvasAndNativeStrokePixels.*passed' "$GITHUB_WORKSPACE/logs/drawing-visual-comparison.log"
          grep -E 'Test Case .*testPressureSensitiveHighlighterRemainsUnsupported.*passed' "$GITHUB_WORKSPACE/logs/drawing-visual-comparison.log"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Worlds-drawing-visual-comparison
          path: |
            logs/
            drawing-visual-comparison.xcresult/
          if-no-files-found: warn

  rust-mcp-compatibility:
    name: MCP Rust compatibility tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.99.1
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: Apple/RustMCP
      - name: Run MCP compatibility tests
        shell: bash
        run: |
          set -o pipefail
          mkdir -p logs
          cargo test --locked --manifest-path Apple/RustMCP/Cargo.toml 2>&1 | tee logs/rust-mcp-tests.log
          grep -q 'actual_permission_gate_denies_hidden_and_write_before_dispatch ... ok' logs/rust-mcp-tests.log
          grep -q 'actual_permission_gate_rejects_unexpected_touched_page_and_rolls_back ... ok' logs/rust-mcp-tests.log
          grep -q 'actual_result_filter_removes_hidden_page ... ok' logs/rust-mcp-tests.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Worlds-rust-mcp-test-log
          path: logs/
          if-no-files-found: warn

  ios:
    name: Worlds-${{ matrix.device }} build check
    runs-on: macos-26
    strategy:
      fail-fast: false
      matrix:
        include:
          - device: iPhone
            family: 1
          - device: iPad
            family: 2
    steps:
      - uses: actions/checkout@v4
      - name: Select and inspect Xcode
        run: |
          sudo xcode-select --switch /Applications/Xcode_26.6.app/Contents/Developer
          xcodebuild -version
          xcodebuild -showsdks
      - name: Install project generator
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate --spec Apple/project.yml
      - name: Build simulator
        shell: bash
        run: |
          set -o pipefail
          mkdir -p logs
          xcodebuild -project Apple/Worlds.xcodeproj -scheme Worlds-iOS \
            -configuration Release -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/WorldsSimulator" \
            TARGETED_DEVICE_FAMILY=${{ matrix.family }} CODE_SIGNING_ALLOWED=NO build \
            2>&1 | tee logs/${{ matrix.device }}-simulator.log
          test ! -e "$RUNNER_TEMP/WorldsSimulator/Build/Products/Release-iphonesimulator/Worlds.app/worlds-v1-fixture.db"
          test ! -e "$RUNNER_TEMP/WorldsSimulator/Build/Products/Release-iphonesimulator/Worlds.app/search-ui-fixture.db"
          test ! -e "$RUNNER_TEMP/WorldsSimulator/Build/Products/Release-iphonesimulator/Worlds.app/reader-ui-fixture.db"
      - name: Build unsigned device target
        shell: bash
        run: |
          set -o pipefail
          xcodebuild -project Apple/Worlds.xcodeproj -scheme Worlds-iOS \
            -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/WorldsDevice" \
            TARGETED_DEVICE_FAMILY=${{ matrix.family }} CODE_SIGNING_ALLOWED=NO build \
            2>&1 | tee logs/${{ matrix.device }}-device.log
          test ! -e "$RUNNER_TEMP/WorldsDevice/Build/Products/Release-iphoneos/Worlds.app/worlds-v1-fixture.db"
          test ! -e "$RUNNER_TEMP/WorldsDevice/Build/Products/Release-iphoneos/Worlds.app/search-ui-fixture.db"
          test ! -e "$RUNNER_TEMP/WorldsDevice/Build/Products/Release-iphoneos/Worlds.app/reader-ui-fixture.db"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Worlds-${{ matrix.device }}-build-logs
          path: logs/
          if-no-files-found: warn

  macos:
    name: Worlds-macOS build check
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Select and inspect Xcode
        run: |
          sudo xcode-select --switch /Applications/Xcode_26.6.app/Contents/Developer
          xcodebuild -version
          xcodebuild -showsdks
      - name: Install project generator
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate --spec Apple/project.yml
      - name: Build unsigned application target
        shell: bash
        run: |
          set -o pipefail
          mkdir -p logs
          xcodebuild -project Apple/Worlds.xcodeproj -scheme Worlds-macOS \
            -configuration Release -destination 'generic/platform=macOS' \
            -derivedDataPath "$RUNNER_TEMP/WorldsMac" CODE_SIGNING_ALLOWED=NO build \
            2>&1 | tee logs/macos.log
          test ! -e "$RUNNER_TEMP/WorldsMac/Build/Products/Release/Worlds.app/Contents/Resources/worlds-v1-fixture.db"
          test ! -e "$RUNNER_TEMP/WorldsMac/Build/Products/Release/Worlds.app/Contents/Resources/search-ui-fixture.db"
          test ! -e "$RUNNER_TEMP/WorldsMac/Build/Products/Release/Worlds.app/Contents/Resources/reader-ui-fixture.db"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Worlds-macOS-build-logs
          path: logs/
          if-no-files-found: warn

  native-writes:
    name: Rust bridge and native write tests
    runs-on: macos-26
    timeout-minutes: 45
    env:
      WORLDS_REQUIRE_NATIVE_WRITES: "1"
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: |
          sudo xcode-select --switch /Applications/Xcode_26.6.app/Contents/Developer
          xcodebuild -version
      - uses: dtolnay/rust-toolchain@stable
      - name: Build required XCFramework
        shell: bash
        run: |
          set -o pipefail
          mkdir -p logs
          bash Apple/RustStore/scripts/build-apple.sh 2>&1 | tee logs/rust-xcframework.log
          test -d Apple/WorldsCore/Artifacts/WorldsRustStore.xcframework
      - name: Test Rust store on macOS
        shell: bash
        run: |
          set -o pipefail
          cargo test --locked --manifest-path Apple/RustStore/Cargo.toml 2>&1 | tee logs/rust-store-tests.log
          grep -q 'owned_asset_file_required_and_failures_roll_back ... ok' logs/rust-store-tests.log
          grep -q 'symlinked_attachment_is_rejected ... ok' logs/rust-store-tests.log
          grep -q 'asset_scan_includes_nested_history_references ... ok' logs/rust-store-tests.log
          grep -q 'refuses_symlink_components_and_parent_escape ... ok' logs/rust-store-tests.log
          grep -q 'open_handle_does_not_pin_future_path_contents ... ok' logs/rust-store-tests.log
      - name: Discover required write tests
        shell: bash
        run: |
          set -o pipefail
          swift test --package-path Apple/WorldsCore list 2>&1 | tee logs/write-tests-discovery.log
          grep -q 'NativePersonalStoreTests' logs/write-tests-discovery.log
          grep -q 'testSQLiteLinkageAndFTSAvailability' logs/write-tests-discovery.log
      - name: Test write bridge on macOS
        shell: bash
        run: |
          set -o pipefail
          swift test --package-path Apple/WorldsCore --filter NativePersonalStoreTests 2>&1 | tee logs/write-tests-macos.log
          grep -q 'testSQLiteLinkageAndFTSAvailability' logs/write-tests-macos.log
      - name: Discover editor persistence tests
        shell: bash
        run: |
          set -o pipefail
          swift test --package-path Apple/WorldsCore list 2>&1 | tee logs/editor-persistence-discovery.log
          grep -q 'testEditorSavePreservesUnknownNodeAndAttributes' logs/editor-persistence-discovery.log
          grep -q 'testConflictAtSameTimestampKeepsDirtyEditorAndDatabase' logs/editor-persistence-discovery.log
          grep -q 'testRejectsPageBecomingSharedBeforeSave' logs/editor-persistence-discovery.log
          grep -q 'testTwoEditorSessionsRejectStaleSnapshot' logs/editor-persistence-discovery.log
          grep -q 'testRejectsReorderedBlocksWithoutTimestampChange' logs/editor-persistence-discovery.log
      - name: Test editor persistence on macOS
        shell: bash
        run: |
          set -o pipefail
          swift test --package-path Apple/WorldsCore --filter WorldsEditorPersistenceTests 2>&1 | tee logs/editor-persistence-macos.log
          grep -q 'testEditorSavePreservesUnknownNodeAndAttributes' logs/editor-persistence-macos.log
          grep -q 'testConflictAtSameTimestampKeepsDirtyEditorAndDatabase' logs/editor-persistence-macos.log
          grep -q 'testRejectsPageBecomingSharedBeforeSave' logs/editor-persistence-macos.log
          grep -q 'testTwoEditorSessionsRejectStaleSnapshot' logs/editor-persistence-macos.log
          grep -q 'testRejectsReorderedBlocksWithoutTimestampChange' logs/editor-persistence-macos.log
      - name: Discover and test project editing on macOS
        shell: bash
        run: |
          set -o pipefail
          swift test --package-path Apple/WorldsCore list 2>&1 | tee logs/project-editing-discovery.log
          grep -q 'testUndoAndFullBaselineConflictOnRealStore' logs/project-editing-discovery.log
          grep -q 'testSavePreservesUnknownMetadataAndRefusesShared' logs/project-editing-discovery.log
          swift test --package-path Apple/WorldsCore --filter WorldsProjectEditingTests 2>&1 | tee logs/project-editing-macos.log
          grep -E 'testUndoAndFullBaselineConflictOnRealStore.*passed' logs/project-editing-macos.log
          grep -E 'testSavePreservesUnknownMetadataAndRefusesShared.*passed' logs/project-editing-macos.log
      - name: Discover resource repository tests
        shell: bash
        run: |
          set -o pipefail
          swift test --package-path Apple/WorldsCore list 2>&1 | tee logs/resource-repositories-discovery.log
          grep -q 'testProjectUsesNativeStoreAndRejectsSameTimestampChange' logs/resource-repositories-discovery.log
          grep -q 'testGalleryUsesNativeStoreAndKeepsAttachment' logs/resource-repositories-discovery.log
      - name: Test resource repositories on macOS
        shell: bash
        run: |
          set -o pipefail
          swift test --package-path Apple/WorldsCore --filter WorldsResourceRepositoriesTests 2>&1 | tee logs/resource-repositories-macos.log
          grep -q 'testProjectUsesNativeStoreAndRejectsSameTimestampChange' logs/resource-repositories-macos.log
          grep -q 'testGalleryUsesNativeStoreAndKeepsAttachment' logs/resource-repositories-macos.log
      - name: Discover native automation tests
        shell: bash
        run: |
          set -o pipefail
          swift test --package-path Apple/WorldsCore list 2>&1 | tee logs/automation-discovery.log
          grep -q 'testIsolatedScheduleClaimRestartAndDecline' logs/automation-discovery.log
          grep -q 'testMissedScheduleIsSkippedWithoutApproval' logs/automation-discovery.log
      - name: Test native automation on macOS
        shell: bash
        run: |
          set -o pipefail
          swift test --package-path Apple/WorldsCore --filter NativeAutomationDriverTests 2>&1 | tee logs/automation-macos.log
          grep -q 'testIsolatedScheduleClaimRestartAndDecline' logs/automation-macos.log
          grep -q 'testMissedScheduleIsSkippedWithoutApproval' logs/automation-macos.log
      - name: Discover presentation persistence tests
        shell: bash
        run: |
          set -o pipefail
          swift test --package-path Apple/WorldsCore list 2>&1 | tee logs/presentation-persistence-discovery.log
          grep -q 'testSaveKeepsOpaqueAndConflictingSessionFails' logs/presentation-persistence-discovery.log
      - name: Test presentation persistence on macOS
        shell: bash
        run: |
          set -o pipefail
          swift test --package-path Apple/WorldsCore --filter WorldsPresentationPersistenceTests 2>&1 | tee logs/presentation-persistence-macos.log
          grep -q 'testSaveKeepsOpaqueAndConflictingSessionFails' logs/presentation-persistence-macos.log
      - name: Discover drawing validation tests
        shell: bash
        run: |
          set -o pipefail
          swift test --package-path Apple/WorldsCore list 2>&1 | tee logs/drawing-validation-discovery.log
          grep -q 'testOriginalSceneFixtureAndInvalidFrame' logs/drawing-validation-discovery.log
      - name: Test drawing validation on macOS
        shell: bash
        run: |
          set -o pipefail
          swift test --package-path Apple/WorldsCore --filter WorldsDrawingValidationTests 2>&1 | tee logs/drawing-validation-macos.log
          grep -q 'testOriginalSceneFixtureAndInvalidFrame' logs/drawing-validation-macos.log
      - name: Discover drawing write tests
        shell: bash
        run: |
          set -o pipefail
          swift test --package-path Apple/WorldsCore list 2>&1 | tee logs/drawing-writes-discovery.log
          grep -q 'testPersonalDrawingOriginalSaveAndConflict' logs/drawing-writes-discovery.log
      - name: Test drawing writes on macOS
        shell: bash
        run: |
          set -o pipefail
          swift test --package-path Apple/WorldsCore --filter WorldsDrawingNativeWritesTests 2>&1 | tee logs/drawing-writes-macos.log
          grep -q 'testPersonalDrawingOriginalSaveAndConflict' logs/drawing-writes-macos.log
      - name: Test native writes on iOS simulator
        shell: bash
        run: |
          set -o pipefail
          cd Apple/WorldsCore
          xcodebuild -scheme WorldsCore-Package \
            -destination 'platform=iOS Simulator,name=iPhone 17,OS=26.5' \
            -only-testing:WorldsNativeWritesTests/NativePersonalStoreTests \
            -only-testing:WorldsEditorPersistenceTests \
            -only-testing:WorldsResourceRepositoriesTests \
            -only-testing:WorldsProjectEditingTests \
            -only-testing:WorldsAutomationsTests/NativeAutomationDriverTests \
            -only-testing:WorldsPresentationPersistenceTests \
            -only-testing:WorldsDrawingValidationTests \
            -only-testing:WorldsDrawingNativeWritesTests \
            -resultBundlePath "$GITHUB_WORKSPACE/native-writes-simulator.xcresult" \
            CODE_SIGNING_ALLOWED=NO test 2>&1 | tee "$GITHUB_WORKSPACE/logs/native-writes-ios.log"
          grep -E "Test Case .*testSQLiteLinkageAndFTSAvailability.*passed" "$GITHUB_WORKSPACE/logs/native-writes-ios.log"
          grep -E "Test Case .*testEditorSavePreservesUnknownNodeAndAttributes.*passed" "$GITHUB_WORKSPACE/logs/native-writes-ios.log"
          grep -E "Test Case .*testConflictAtSameTimestampKeepsDirtyEditorAndDatabase.*passed" "$GITHUB_WORKSPACE/logs/native-writes-ios.log"
          grep -E "Test Case .*testRejectsPageBecomingSharedBeforeSave.*passed" "$GITHUB_WORKSPACE/logs/native-writes-ios.log"
          grep -E "Test Case .*testTwoEditorSessionsRejectStaleSnapshot.*passed" "$GITHUB_WORKSPACE/logs/native-writes-ios.log"
          grep -E "Test Case .*testRejectsReorderedBlocksWithoutTimestampChange.*passed" "$GITHUB_WORKSPACE/logs/native-writes-ios.log"
          grep -E "Test Case .*testProjectUsesNativeStoreAndRejectsSameTimestampChange.*passed" "$GITHUB_WORKSPACE/logs/native-writes-ios.log"
          grep -E "Test Case .*testUndoAndFullBaselineConflictOnRealStore.*passed" "$GITHUB_WORKSPACE/logs/native-writes-ios.log"
          grep -E "Test Case .*testSavePreservesUnknownMetadataAndRefusesShared.*passed" "$GITHUB_WORKSPACE/logs/native-writes-ios.log"
          grep -E "Test Case .*testGalleryUsesNativeStoreAndKeepsAttachment.*passed" "$GITHUB_WORKSPACE/logs/native-writes-ios.log"
          grep -E "Test Case .*testIsolatedScheduleClaimRestartAndDecline.*passed" "$GITHUB_WORKSPACE/logs/native-writes-ios.log"
          grep -E "Test Case .*testMissedScheduleIsSkippedWithoutApproval.*passed" "$GITHUB_WORKSPACE/logs/native-writes-ios.log"
          grep -E "Test Case .*testSaveKeepsOpaqueAndConflictingSessionFails.*passed" "$GITHUB_WORKSPACE/logs/native-writes-ios.log"
          grep -E "Test Case .*testOriginalSceneFixtureAndInvalidFrame.*passed" "$GITHUB_WORKSPACE/logs/native-writes-ios.log"
          grep -E "Test Case .*testPersonalDrawingOriginalSaveAndConflict.*passed" "$GITHUB_WORKSPACE/logs/native-writes-ios.log"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Worlds-native-write-test-results
          path: |
            logs/
            native-writes-simulator.xcresult/
          if-no-files-found: warn

  collaboration-xcframework:
    name: Build shared collaboration XCFramework
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: |
          sudo xcode-select --switch /Applications/Xcode_26.6.app/Contents/Developer
          xcodebuild -version
      - uses: dtolnay/rust-toolchain@1.99.1
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim,x86_64-apple-ios,aarch64-apple-darwin,x86_64-apple-darwin
      - name: Build and archive collaboration bridge
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p logs shared-artifact
          bash Apple/RustCollaboration/scripts/build-apple.sh 2>&1 | tee logs/collaboration-build.log
          test -d Apple/WorldsCore/Artifacts/WorldsRustCollaboration.xcframework
          tar -czf shared-artifact/collaboration-xcframework.tar.gz -C Apple/WorldsCore/Artifacts WorldsRustCollaboration.xcframework
          (cd shared-artifact && shasum -a 256 collaboration-xcframework.tar.gz > SHA256SUMS)
          git rev-parse HEAD > shared-artifact/source-revision
      - uses: actions/upload-artifact@v4
        with:
          name: Worlds-shared-collaboration-xcframework
          path: shared-artifact/
          if-no-files-found: error
          retention-days: 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Worlds-shared-collaboration-build-logs
          path: logs/
          if-no-files-found: warn

  collaboration-bridge:
    name: Rust collaboration bridge tests
    runs-on: macos-26
    needs: collaboration-xcframework
    timeout-minutes: 45
    env:
      WORLDS_REQUIRE_COLLABORATION: "1"
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: |
          sudo xcode-select --switch /Applications/Xcode_26.6.app/Contents/Developer
          xcodebuild -version
      - uses: actions/download-artifact@v4
        with:
          name: Worlds-shared-collaboration-xcframework
          path: shared-artifact
      - name: Verify and restore collaboration XCFramework
        shell: bash
        run: |
          set -euo pipefail
          test "$(cat shared-artifact/source-revision)" = "$GITHUB_SHA"
          (cd shared-artifact && shasum -a 256 -c SHA256SUMS)
          mkdir -p logs Apple/WorldsCore/Artifacts
          tar -xzf shared-artifact/collaboration-xcframework.tar.gz -C Apple/WorldsCore/Artifacts
          test -d Apple/WorldsCore/Artifacts/WorldsRustCollaboration.xcframework
      - name: Discover collaboration tests
        shell: bash
        run: |
          set -o pipefail
          swift test --package-path Apple/WorldsCore list 2>&1 | tee logs/collaboration-discovery.log
          grep -q 'testNativeFixtureStateVectorAndIncrement' logs/collaboration-discovery.log
          grep -q 'testMalformedUpdatesFailWithoutFreeingTheDocument' logs/collaboration-discovery.log
          grep -q 'testSessionAcknowledgesHandshakeWatermark' logs/collaboration-discovery.log
          grep -q 'testSQLiteStoreOnWorldsV11Fixture' logs/collaboration-discovery.log
          grep -q 'testRejectsSyncBeforeIdentityVerification' logs/collaboration-discovery.log
          grep -q 'testDefaultTransportRejectsRedirectBeforeBearerCanBeForwarded' logs/collaboration-discovery.log
          grep -q 'testDefaultSocketLifecycleWithLocalRefusal' logs/collaboration-discovery.log
          grep -q 'testCheckedEditorWritePersistsAndRejectsStaleBase' logs/collaboration-discovery.log
          grep -q 'testViewerCannotPrepareEditorWrite' logs/collaboration-discovery.log
      - name: Test collaboration bridge on macOS
        shell: bash
        run: |
          set -o pipefail
          swift test --package-path Apple/WorldsCore --filter WorldsCollaborationTests 2>&1 | tee logs/collaboration-macos.log
          grep -q 'testNativeFixtureStateVectorAndIncrement' logs/collaboration-macos.log
          grep -q 'testMalformedUpdatesFailWithoutFreeingTheDocument' logs/collaboration-macos.log
          grep -q 'testSessionAcknowledgesHandshakeWatermark' logs/collaboration-macos.log
          grep -q 'testSQLiteStoreOnWorldsV11Fixture' logs/collaboration-macos.log
          grep -q 'testRejectsSyncBeforeIdentityVerification' logs/collaboration-macos.log
          grep -q 'testDefaultTransportRejectsRedirectBeforeBearerCanBeForwarded' logs/collaboration-macos.log
          grep -q 'testDefaultSocketLifecycleWithLocalRefusal' logs/collaboration-macos.log
          grep -q 'testCheckedEditorWritePersistsAndRejectsStaleBase' logs/collaboration-macos.log
          grep -q 'testViewerCannotPrepareEditorWrite' logs/collaboration-macos.log
      - name: Test collaboration bridge on iOS simulator
        shell: bash
        run: |
          set -o pipefail
          cd Apple/WorldsCore
          xcodebuild -scheme WorldsCore-Package \
            -destination 'platform=iOS Simulator,name=iPhone 17,OS=26.5' \
            -only-testing:WorldsCollaborationTests \
            -resultBundlePath "$GITHUB_WORKSPACE/collaboration-simulator.xcresult" \
            CODE_SIGNING_ALLOWED=NO test 2>&1 | tee "$GITHUB_WORKSPACE/logs/collaboration-ios.log"
          grep -q 'testNativeFixtureStateVectorAndIncrement' "$GITHUB_WORKSPACE/logs/collaboration-ios.log"
          grep -q 'testMalformedUpdatesFailWithoutFreeingTheDocument' "$GITHUB_WORKSPACE/logs/collaboration-ios.log"
          grep -q 'testSessionAcknowledgesHandshakeWatermark' "$GITHUB_WORKSPACE/logs/collaboration-ios.log"
          grep -q 'testSQLiteStoreOnWorldsV11Fixture' "$GITHUB_WORKSPACE/logs/collaboration-ios.log"
          grep -q 'testRejectsSyncBeforeIdentityVerification' "$GITHUB_WORKSPACE/logs/collaboration-ios.log"
          grep -q 'testDefaultTransportRejectsRedirectBeforeBearerCanBeForwarded' "$GITHUB_WORKSPACE/logs/collaboration-ios.log"
          grep -q 'testDefaultSocketLifecycleWithLocalRefusal' "$GITHUB_WORKSPACE/logs/collaboration-ios.log"
          grep -q 'testCheckedEditorWritePersistsAndRejectsStaleBase' "$GITHUB_WORKSPACE/logs/collaboration-ios.log"
          grep -q 'testViewerCannotPrepareEditorWrite' "$GITHUB_WORKSPACE/logs/collaboration-ios.log"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Worlds-collaboration-test-results
          path: |
            logs/
            collaboration-simulator.xcresult/
          if-no-files-found: warn

  collaboration-local-worker:
    name: Rust collaboration with isolated local sync Worker
    runs-on: macos-26
    needs: collaboration-xcframework
    timeout-minutes: 45
    env:
      WORLDS_REQUIRE_COLLABORATION: "1"
      WORLDS_REQUIRE_LIVE_SERVICE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: services/sync/pnpm-lock.yaml
      - uses: dtolnay/rust-toolchain@1.99.1
      - name: Select Xcode
        run: |
          sudo xcode-select --switch /Applications/Xcode_26.6.app/Contents/Developer
          xcodebuild -version
      - uses: actions/download-artifact@v4
        with:
          name: Worlds-shared-collaboration-xcframework
          path: shared-artifact
      - name: Verify and restore collaboration XCFramework
        shell: bash
        run: |
          set -euo pipefail
          test "$(cat shared-artifact/source-revision)" = "$GITHUB_SHA"
          (cd shared-artifact && shasum -a 256 -c SHA256SUMS)
          mkdir -p logs Apple/WorldsCore/Artifacts
          tar -xzf shared-artifact/collaboration-xcframework.tar.gz -C Apple/WorldsCore/Artifacts
          test -d Apple/WorldsCore/Artifacts/WorldsRustCollaboration.xcframework
      - name: Discover required live Swift test
        shell: bash
        run: |
          set -o pipefail
          swift test --package-path Apple/WorldsCore list 2>&1 | tee logs/local-swift-discovery.log
          grep -q 'testLiveSwiftSessionsConvergeReconnectAndArchiveRefusal' logs/local-swift-discovery.log
          grep -q 'testLiveAwarenessExchangeAndDisconnect' logs/local-swift-discovery.log
          grep -q 'testLiveCheckedEditorsConvergeAfterReconnect' logs/local-swift-discovery.log
          grep -q 'testDiagnosticDefaultTransportLoopbackHandshake' logs/local-swift-discovery.log
          grep -q 'testDiagnosticSharedSessionLoopbackHandshake' logs/local-swift-discovery.log
          grep -q 'testDiagnosticSingleClientWithPresence' logs/local-swift-discovery.log
          grep -q 'testDiagnosticTwoClientsWithoutPresence' logs/local-swift-discovery.log
      - name: Install isolated Worker dependencies
        working-directory: services/sync
        run: pnpm install --frozen-lockfile
      - name: Run isolated local service integration
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p logs
          cd services/sync
          pnpm exec wrangler dev -c dev/identity.toml --port 18791 --inspector-port 19891 --ip 127.0.0.1 --persist-to "$RUNNER_TEMP/identity" > "$GITHUB_WORKSPACE/logs/local-identity.log" 2>&1 &
          identity_pid=$!
          sync_pid=""
          trap 'kill "$identity_pid" ${sync_pid:+"$sync_pid"} 2>/dev/null || true' EXIT
          ready=0
          for attempt in $(seq 1 90); do
            if curl -fsS http://127.0.0.1:18791/.well-known/jwks.json >/dev/null 2>&1; then ready=1; break; fi
            sleep 1
          done
          if [ "$ready" != 1 ]; then
            echo "Local service readiness failed; listening ports follow" >&2
            lsof -nP -iTCP -sTCP:LISTEN >&2 || true
            exit 1
          fi
          pnpm exec wrangler dev --env local --port 18790 --inspector-port 19890 --ip 127.0.0.1 --persist-to "$RUNNER_TEMP/sync" --var JWKS_URL:http://127.0.0.1:18791/.well-known/jwks.json > "$GITHUB_WORKSPACE/logs/local-sync.log" 2>&1 &
          sync_pid=$!
          editor_token=$(curl -fsS 'http://127.0.0.1:18791/dev/token?sub=editor' | jq -er .token)
          viewer_token=$(curl -fsS 'http://127.0.0.1:18791/dev/token?sub=viewer' | jq -er .token)
          curl -fsS -X POST http://127.0.0.1:18791/dev/grant -H 'Content-Type: application/json' \
            --data '{"userId":"viewer","workspaceId":"fixture-workspace","docId":null,"level":"view"}' >/dev/null
          ready=0
          for attempt in $(seq 1 90); do
            if curl -fsS -H "Authorization: Bearer $editor_token" http://127.0.0.1:18790/v1/workspaces/fixture-workspace/docs/probe/versions >/dev/null 2>&1; then ready=1; break; fi
            sleep 1
          done
          if [ "$ready" != 1 ]; then
            echo "Local service readiness failed; listening ports follow" >&2
            lsof -nP -iTCP -sTCP:LISTEN >&2 || true
            exit 1
          fi
          cd "$GITHUB_WORKSPACE"
          WORLDS_LIVE_SYNC_URL=ws://127.0.0.1:18790 \
          WORLDS_LIVE_EDITOR_TOKEN="$editor_token" WORLDS_LIVE_VIEWER_TOKEN="$viewer_token" \
            cargo test --locked --manifest-path Apple/RustCollaboration/Cargo.toml --test live_service -- --ignored --nocapture \
            2>&1 | tee logs/collaboration-local-worker.log
          grep -q 'live_native_replica_offline_merge_reconnect_and_refusal ... ok' logs/collaboration-local-worker.log
          cargo test --locked --manifest-path Apple/RustCollaboration/Cargo.toml --test editor -- --nocapture \
            2>&1 | tee logs/collaboration-editor-rust.log
          grep -q 'concurrent_insertions_converge_without_losing_either_edit ... ok' logs/collaboration-editor-rust.log
          grep -q 'rejects_stale_content_surrogate_boundaries_and_rich_formatting ... ok' logs/collaboration-editor-rust.log
          cargo test --locked --manifest-path Apple/RustCollaboration/Cargo.toml --test store -- --nocapture \
            2>&1 | tee logs/collaboration-store-rust.log
          grep -q 'editor_transaction_rejects_stale_and_rolls_back_outbox_failure ... ok' logs/collaboration-store-rust.log
          grep -q 'editor_ffi_commits_and_reports_stale_base ... ok' logs/collaboration-store-rust.log
          diagnostic_status=0
          for diagnostic in testDiagnosticDefaultTransportLoopbackHandshake testDiagnosticSharedSessionLoopbackHandshake testDiagnosticSingleClientWithPresence testDiagnosticTwoClientsWithoutPresence; do
            if WORLDS_LIVE_SYNC_URL=ws://127.0.0.1:18790 \
              WORLDS_LIVE_EDITOR_TOKEN="$editor_token" WORLDS_LIVE_VIEWER_TOKEN="$viewer_token" \
              swift test --package-path Apple/WorldsCore --filter "$diagnostic" \
              2>&1 | tee "logs/${diagnostic}.log"; then
              grep -E "Test Case .*${diagnostic}.*passed" "logs/${diagnostic}.log" || diagnostic_status=1
            else
              diagnostic_status=1
            fi
          done
          WORLDS_LIVE_SYNC_URL=ws://127.0.0.1:18790 \
          WORLDS_LIVE_EDITOR_TOKEN="$editor_token" WORLDS_LIVE_VIEWER_TOKEN="$viewer_token" \
            swift test --package-path Apple/WorldsCore --filter LiveWorkerTests \
            2>&1 | tee logs/collaboration-live-swift.log
          grep -q 'testLiveSwiftSessionsConvergeReconnectAndArchiveRefusal' logs/collaboration-live-swift.log
          grep -q 'testLiveAwarenessExchangeAndDisconnect' logs/collaboration-live-swift.log
          grep -q 'testLiveCheckedEditorsConvergeAfterReconnect' logs/collaboration-live-swift.log
          grep -Eq 'Executed 3 tests, with 0 failures' logs/collaboration-live-swift.log
          test "$diagnostic_status" = 0
      - name: Collect XCTest crash reports
        if: failure()
        shell: bash
        run: |
          mkdir -p logs/crash-reports
          find "$HOME/Library/Logs/DiagnosticReports" -maxdepth 1 -type f \
            \( -name 'xctest*.ips' -o -name 'xctest*.crash' \) \
            -exec cp {} logs/crash-reports/ \; 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Worlds-local-collaboration-worker-logs
          path: logs/
          if-no-files-found: warn

  ui-tests:
    name: UI tests ${{ matrix.device }}
    runs-on: macos-26
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - device: iPhone
            scheme: Worlds-iOS
            destination: 'platform=iOS Simulator,name=iPhone 17,OS=26.5'
          - device: iPad
            scheme: Worlds-iOS
            destination: 'platform=iOS Simulator,name=iPad (A16),OS=26.5'
          - device: macOS
            scheme: Worlds-macOS
            destination: 'platform=macOS'
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: |
          sudo xcode-select --switch /Applications/Xcode_26.6.app/Contents/Developer
          xcodebuild -version
          xcrun simctl list devices available
      - name: Install project generator and timeout utility
        run: |
          brew install xcodegen
          command -v gtimeout >/dev/null || brew install coreutils
      - name: Generate project
        run: xcodegen generate --spec Apple/project.yml
      - name: Run UI automation and retain results
        shell: bash
        run: |
          set -o pipefail
          mkdir -p logs results
          gtimeout --kill-after=30s 15m xcodebuild -project Apple/Worlds.xcodeproj -scheme '${{ matrix.scheme }}' \
            -configuration Debug -destination '${{ matrix.destination }}' \
            -derivedDataPath "$RUNNER_TEMP/WorldsUI" \
            -resultBundlePath "$GITHUB_WORKSPACE/results/${{ matrix.device }}.xcresult" \
            CODE_SIGNING_ALLOWED=NO test 2>&1 | tee logs/ui-${{ matrix.device }}.log
          grep -Eq 'testRightToLeftNavigationAndReading.*passed' logs/ui-${{ matrix.device }}.log
          grep -Eq 'testReaderShowsStructuredContentAndExpandsToggle.*passed' logs/ui-${{ matrix.device }}.log
          grep -Eq 'testProjectSummaryAndLinkedPage.*passed' logs/ui-${{ matrix.device }}.log
          grep -Eq 'testGallerySummary.*passed' logs/ui-${{ matrix.device }}.log
          grep -Eq 'testPresentationSummary.*passed' logs/ui-${{ matrix.device }}.log
          grep -Eq 'testFileSummary.*passed' logs/ui-${{ matrix.device }}.log
          if [[ "${{ matrix.device }}" == "macOS" ]]; then
            grep -Eq 'testLargeReaderWindow.*passed' logs/ui-${{ matrix.device }}.log
          fi
      - name: Export screenshot attachments
        if: always()
        shell: bash
        run: |
          result="results/${{ matrix.device }}.xcresult"
          if [ -d "$result" ]; then
            mkdir -p screenshots
            xcrun xcresulttool export attachments --path "$result" --output-path screenshots
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Worlds-${{ matrix.device }}-UI-results
          path: |
            results/
            screenshots/
            logs/
            Apple/App/UI_TEST_COVERAGE.md
          if-no-files-found: warn

  package-ios:
    name: Package incomplete Worlds ${{ matrix.device }}
    runs-on: macos-26
    timeout-minutes: 20
    needs: [core-tests, rust-mcp-compatibility, ios, macos, native-writes, collaboration-bridge, collaboration-local-worker, ui-tests]
    strategy:
      fail-fast: false
      matrix:
        include:
          - device: iPhone
            family: 1
          - device: iPad
            family: 2
    steps:
      - uses: actions/checkout@v4
      - name: Select pinned Xcode and generate project
        run: |
          sudo xcode-select --switch /Applications/Xcode_26.6.app/Contents/Developer
          xcodebuild -version
          brew install xcodegen
          xcodegen generate --spec Apple/project.yml
      - name: Build and package unsigned device app
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p logs deliverables "$RUNNER_TEMP/package/Payload"
          xcodebuild -project Apple/Worlds.xcodeproj -scheme Worlds-iOS \
            -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/WorldsPackage" TARGETED_DEVICE_FAMILY=${{ matrix.family }} \
            CODE_SIGNING_ALLOWED=NO build 2>&1 | tee logs/ios-package.log
          app="$RUNNER_TEMP/WorldsPackage/Build/Products/Release-iphoneos/Worlds.app"
          test -d "$app"
          test ! -e "$app/worlds-v1-fixture.db"
          test ! -e "$app/search-ui-fixture.db"
          test ! -e "$app/reader-ui-fixture.db"
          ditto "$app" "$RUNNER_TEMP/package/Payload/Worlds.app"
          (cd "$RUNNER_TEMP/package" && zip -qry "$GITHUB_WORKSPACE/deliverables/Worlds-${{ matrix.device }}-Unsigned.ipa" Payload)
          xcodebuild -project Apple/Worlds.xcodeproj -scheme Worlds-iOS \
            -configuration Release -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/WorldsSimulatorPackage" TARGETED_DEVICE_FAMILY=${{ matrix.family }} \
            CODE_SIGNING_ALLOWED=NO build 2>&1 | tee logs/ios-simulator-package.log
          simulator_app="$RUNNER_TEMP/WorldsSimulatorPackage/Build/Products/Release-iphonesimulator/Worlds.app"
          test -d "$simulator_app"
          test ! -e "$simulator_app/worlds-v1-fixture.db"
          test ! -e "$simulator_app/search-ui-fixture.db"
          test ! -e "$simulator_app/reader-ui-fixture.db"
          ditto -c -k --sequesterRsrc --keepParent "$simulator_app" "deliverables/Worlds-${{ matrix.device }}-Simulator.zip"
          cat > deliverables/README-INCOMPLETE.txt <<'EOF'
          This is an incomplete development build, not feature parity with Worlds.
          The IPA is unsigned and cannot be installed directly on a physical device.
          It requires appropriate signing and provisioning before device installation.
          A passing build and automated tests do not establish complete visual review.
          EOF
      - uses: actions/upload-artifact@v4
        with:
          name: Worlds-${{ matrix.device }}-INCOMPLETE-unsigned
          path: deliverables/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Worlds-${{ matrix.device }}-package-build-log
          path: logs/
          if-no-files-found: warn

  package-macos:
    name: Package incomplete Worlds macOS
    runs-on: macos-26
    timeout-minutes: 20
    needs: [core-tests, rust-mcp-compatibility, ios, macos, native-writes, collaboration-bridge, collaboration-local-worker, ui-tests]
    steps:
      - uses: actions/checkout@v4
      - name: Select pinned Xcode and generate project
        run: |
          sudo xcode-select --switch /Applications/Xcode_26.6.app/Contents/Developer
          xcodebuild -version
          brew install xcodegen
          xcodegen generate --spec Apple/project.yml
      - name: Build and package unsigned macOS app
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p logs deliverables
          xcodebuild -project Apple/Worlds.xcodeproj -scheme Worlds-macOS \
            -configuration Release -destination 'generic/platform=macOS' \
            -derivedDataPath "$RUNNER_TEMP/WorldsPackage" CODE_SIGNING_ALLOWED=NO build \
            2>&1 | tee logs/macos-package.log
          app="$RUNNER_TEMP/WorldsPackage/Build/Products/Release/Worlds.app"
          test -d "$app"
          test ! -e "$app/Contents/Resources/worlds-v1-fixture.db"
          test ! -e "$app/Contents/Resources/search-ui-fixture.db"
          test ! -e "$app/Contents/Resources/reader-ui-fixture.db"
          ditto "$app" deliverables/Worlds-macOS-Unsigned.app
          ditto -c -k --sequesterRsrc --keepParent deliverables/Worlds-macOS-Unsigned.app deliverables/Worlds-macOS-Unsigned.zip
          hdiutil create -volname Worlds -srcfolder deliverables/Worlds-macOS-Unsigned.app -ov -format UDZO deliverables/Worlds-macOS-Unsigned.dmg
          cat > deliverables/README-INCOMPLETE.txt <<'EOF'
          This is an incomplete development build, not feature parity with Worlds.
          The macOS app is unsigned and not notarized. Gatekeeper may block it.
          Use the ZIP or DMG to preserve the application bundle and permissions.
          A passing build and automated tests do not establish complete visual review.
          EOF
      - uses: actions/upload-artifact@v4
        with:
          name: Worlds-macOS-INCOMPLETE-unsigned
          path: |
            deliverables/Worlds-macOS-Unsigned.zip
            deliverables/Worlds-macOS-Unsigned.dmg
            deliverables/README-INCOMPLETE.txt
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: Worlds-macOS-INCOMPLETE-app-bundle
          path: deliverables/Worlds-macOS-Unsigned.app/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Worlds-macOS-package-build-log
          path: logs/
          if-no-files-found: warn
