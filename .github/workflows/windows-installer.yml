name: Windows installer

# Builds the Windows installer (NSIS) with the WebView2 offline installer
# inside it, so Worlds installs on PCs without internet or without WebView2.
# Runs only when started by hand from the Actions tab. The checkout never
# contains private/, so the installer is a clean public build. Download it
# from the run's artifacts.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  installer:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: pnpm install --frozen-lockfile
      - name: Build the installer
        run: pnpm tauri build --bundles nsis
      - name: Check that no private files are in the tree
        shell: pwsh
        run: |
          if (Test-Path private) { throw "private/ must not exist in a public build" }
          Get-ChildItem src-tauri/target/release/bundle/nsis/*.exe | ForEach-Object { "{0} {1:N1} MB" -f $_.Name, ($_.Length / 1MB) }
      - uses: actions/upload-artifact@v4
        with:
          name: worlds-windows-installer
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
