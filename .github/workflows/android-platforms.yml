name: Android core checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: Android
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
      - name: Install Android Rust targets and NDK
        run: |
          rustup target add aarch64-linux-android armv7-linux-androideabi x86_64-linux-android i686-linux-android
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'ndk;28.2.13676358'
      - name: Check desktop drawing contracts
        run: |
          node --no-warnings --loader ./core/stylus/tools/desktop-loader.mjs ./core/stylus/tools/desktop-fixtures.mjs --check
          node --no-warnings --experimental-transform-types --loader ./app/tools/drawing-contract-loader.mjs ./app/tools/check-drawing-package.mjs ../docs/android-native/screenshots/project-export-example.worldsdraw
          node --no-warnings --experimental-transform-types --loader ./app/tools/drawing-contract-loader.mjs ./app/tools/generate-desktop-projects.mjs
      - name: Check desktop Markdown fixtures
        run: |
          (cd tools/markdown-contract && cargo run --locked --quiet)
          git diff --exit-code -- core/content/src/androidTest/assets/desktop-markdown.json core/content/src/androidTest/assets/desktop-markdown-import.json
      - name: Test native Yrs engine
        run: cargo test --locked --manifest-path core/sync/native/Cargo.toml
      - name: Build libraries and run checks
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug :app:lintDebug :core:sync:assembleDebug :core:stylus:assembleDebug :core:content:assembleDebug :core:identity:assembleDebug \
            :app:testDebugUnitTest :core:sync:testDebugUnitTest :core:stylus:testDebugUnitTest \
            :core:sync:lintDebug :core:stylus:lintDebug :core:content:lintDebug :core:identity:lintDebug \
            :app:assembleDebugAndroidTest :core:sync:assembleDebugAndroidTest :core:stylus:assembleDebugAndroidTest :core:content:assembleDebugAndroidTest :core:identity:assembleDebugAndroidTest
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: android-core-reports
          path: |
            Android/core/*/build/reports/
            Android/core/*/build/test-results/
            Android/app/build/reports/
          if-no-files-found: ignore

  emulator:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        api: [30, 35]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
      - name: Install Android Rust targets and NDK
        run: |
          rustup target add aarch64-linux-android armv7-linux-androideabi x86_64-linux-android i686-linux-android
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'ndk;28.2.13676358'
      - name: Generate desktop drawing fixtures
        run: node --no-warnings --experimental-transform-types --loader ./Android/app/tools/drawing-contract-loader.mjs ./Android/app/tools/generate-desktop-projects.mjs
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run Android instrumentation tests
        uses: reactivecircus/android-emulator-runner@4c44018e59b437e86cdfc41da381398f93ed8808 # v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect
          script: cd Android && chmod +x gradlew && ./gradlew :app:connectedDebugAndroidTest :core:sync:connectedDebugAndroidTest :core:stylus:connectedDebugAndroidTest :core:content:connectedDebugAndroidTest :core:identity:connectedDebugAndroidTest
      - name: Upload instrumentation reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: android-instrumentation-api-${{ matrix.api }}
          path: |
            Android/core/*/build/reports/androidTests/
            Android/core/*/build/outputs/androidTest-results/
            Android/app/build/reports/androidTests/
            Android/app/build/outputs/androidTest-results/
          if-no-files-found: ignore

  packages:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        working-directory: Android
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Install Android Rust targets and NDK
        run: |
          rustup target add aarch64-linux-android armv7-linux-androideabi x86_64-linux-android i686-linux-android
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'ndk;28.2.13676358'
      - name: Build APKs and app bundle
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug :app:assembleRelease :app:bundleRelease
      - name: Verify signatures and native architectures
        run: |
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)
          test -n "$APKSIGNER"
          python3 tools/package_artifacts.py --apksigner "$APKSIGNER"
      - name: Build and verify architecture-specific APKs
        run: |
          ./gradlew :app:assembleRelease -Pworlds.abiSplits=true
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)
          test -n "$APKSIGNER"
          python3 tools/package_artifacts.py --apksigner "$APKSIGNER" --splits-only
      - name: Upload validated packages
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: worlds-android-packages
          path: Android/build/artifacts/
          if-no-files-found: error
      - name: Upload reviewed library screenshot
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: worlds-android-visual-evidence
          path: |
            docs/android-native/screenshots/library-fixed.png
            docs/android-native/screenshots/narrow-home-final.png
            docs/android-native/screenshots/workspace-keyboard.png
            docs/android-native/screenshots/avif-page.png
            docs/android-native/screenshots/shared-append.png
            docs/android-native/screenshots/shared-heading.png
            docs/android-native/screenshots/shared-heading-editor.png
            docs/android-native/screenshots/shared-markdown.png
          if-no-files-found: error
