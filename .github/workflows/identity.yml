name: Identity service

on:
  push:
    branches: [main]
    paths:
      - "services/identity/**"
      - ".github/workflows/identity.yml"
  pull_request:
    paths:
      - "services/identity/**"
      - ".github/workflows/identity.yml"

concurrency:
  group: identity-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/identity
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: services/identity/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm typecheck
      - name: Tests
        run: pnpm test
