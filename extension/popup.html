<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  :root { color-scheme: light dark; --accent: #2e92ff; }
  body { margin: 0; width: 300px; padding: 14px; font: 14px/1.45 system-ui, "Segoe UI", sans-serif; }
  h1 { font-size: 15px; margin: 0 0 10px; display: flex; gap: 8px; align-items: center; }
  button { display: block; width: 100%; margin: 6px 0; padding: 9px 12px; border: 0; border-radius: 999px; font: inherit; cursor: pointer; background: rgba(127,127,127,0.18); color: inherit; text-align: start; }
  button.primary { background: var(--accent); color: #fff; }
  input { width: 100%; box-sizing: border-box; padding: 7px 10px; border-radius: 10px; border: 1px solid rgba(127,127,127,0.4); background: transparent; color: inherit; font: inherit; }
  .note { font-size: 12px; opacity: 0.7; margin-top: 8px; }
  .status { min-height: 18px; font-size: 12.5px; margin-top: 6px; }
  details { margin-top: 10px; }
</style>
</head>
<body>
  <h1><img src="icon48.png" width="20" height="20" alt="">Worlds</h1>
  <button class="primary" id="page">Save this page</button>
  <button id="selection">Save the selected text</button>
  <button id="article">Save as an article to read later</button>
  <div class="status" id="status"></div>
  <details id="setup">
    <summary>Connect to Worlds</summary>
    <p class="note">In Worlds, open Settings › Editor › Browser extension and copy the token.</p>
    <input id="token" placeholder="Paste the token" autocomplete="off">
  </details>
  <script src="common.js"></script>
  <script src="popup.js"></script>
</body>
</html>
